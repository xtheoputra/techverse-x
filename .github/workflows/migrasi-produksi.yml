# Menjalankan migrasi basis data PRODUKSI.
#
# Kenapa ini ada sebagai workflow, bukan sebagai fasilitas platform (ADR-019):
# Koyeb - tempat API berjalan di tier gratis - TIDAK punya *pre-deploy command*
# seperti Render. Tapi Neon terjangkau dari internet, jadi CI bisa
# menjalankannya.
#
# 🔑 Yang dijalankan adalah CITRA `api` YANG SAMA PERSIS yang akan berjalan di
# produksi, memanggil /app/efbundle di dalamnya. Bukan `dotnet ef` dari kode
# sumber - itu akan menjalankan migrasi dari bit yang BERBEDA dari yang tayang.
#
# ⚠️ SENGAJA MANUAL (workflow_dispatch), bukan otomatis pada push.
# Ia menyentuh data produksi. Gerbang yang dilewati manusia lebih murah daripada
# migrasi salah yang mendarat sendiri. Urutan `migrate -> api` di PENYEBARAN.md
# tetap ditegakkan - oleh urutan tombol, dan itu ditulis apa adanya di sana.

name: Migrasi produksi

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA commit yang citranya akan dimigrasikan - pendek atau penuh, keduanya diterima (harus SAMA dengan yang dipasang di Koyeb)"
        required: true
        type: string

jobs:
  migrasi:
    name: Jalankan bundel migrasi terhadap Neon
    runs-on: ubuntu-latest

    # Environment memberi tempat untuk memasang required reviewer kalau suatu
    # saat diinginkan - gerbang tambahan tanpa mengubah workflow ini.
    environment: produksi

    permissions:
      contents: read
      # Hanya BACA paket. Workflow ini tidak menerbitkan apa pun.
      packages: read

    steps:
      # v4, disematkan per SHA: v3 menyatakan `using: node20`, dan sejak Node 20
      # dicabut dari runner (2026-09-23) ia dipaksa berjalan di Node 24 yang tidak
      # pernah diujikan untuknya. v4 ditulis untuk node24 (dan ESM); inputnya sama.
      # SHA, bukan tag - alasan yang sama dengan gitleaks di ci.yml (ADR-026).
      - name: Masuk ke GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 SHA PENDEK MENGHENTIKAN LANGKAH 3, dan sebabnya murni bentuk tulisan.
      #
      # `rilis-citra.yml` memberi tag `${GITHUB_SHA}` - EMPAT PULUH karakter -
      # sementara manusia menulis SHA tujuh karakter, dan badan issue #38/#39
      # dulu mencontohkannya begitu. `docker pull .../api:b23650e` membalas
      # `manifest unknown`, yang terbaca seperti "citranya belum terbit" padahal
      # citranya ada dan sehat. Terbukti pada gladi bersih 2026-09-09.
      #
      # Diperbaiki DI SINI, bukan dengan menambah tag pendek di rilis-citra.yml:
      # dua nama untuk satu citra justru mengundang kesalahan yang lebih mahal -
      # memigrasi tag yang satu lalu memasang tag yang lain di Koyeb.
      #
      # ⚠️ Kelonggaran ini HANYA berlaku di sini. Koyeb tidak punya langkah
      # kanonikalisasi: di sana ref citranya harus ditulis LENGKAP.
      - name: Kanonikalkan SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASUKAN: ${{ inputs.sha }}
        run: |
          penuh="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MASUKAN}" --jq .sha 2>/dev/null || true)"

          if [ -z "$penuh" ]; then
            echo "::error::SHA '${MASUKAN}' tidak dikenali di repo ini. Ambil dari ringkasan jalan 'Rilis citra' terakhir yang hijau."
            exit 1
          fi

          echo "penuh=$penuh" >> "$GITHUB_OUTPUT"
          echo "Masukan '${MASUKAN}' -> $penuh"

      - name: Siapkan nama citra
        id: nama
        run: echo "citra=ghcr.io/${GITHUB_REPOSITORY,,}/api:${{ steps.sha.outputs.penuh }}" >> "$GITHUB_OUTPUT"

      # Ditarik lebih dulu, terpisah dari langkah menjalankan, supaya kegagalan
      # MENARIK bisa dibedakan dari kegagalan MEMIGRASI. Keduanya punya obat yang
      # sangat berbeda: yang satu soal kredensial atau tag salah, yang lain soal
      # basis data.
      - name: Tarik citra api
        run: |
          if docker pull "${{ steps.nama.outputs.citra }}" 2>"$RUNNER_TEMP/tarik.err"; then
            exit 0
          fi

          cat "$RUNNER_TEMP/tarik.err"

          # 🔑 DUA KEGAGALAN YANG TERLIHAT MIRIP TAPI OBATNYA BERLAWANAN, dan
          # membedakannya di sini supaya tidak ada yang menebak:
          #
          #   manifest unknown  -> kredensialnya DITERIMA; TAGnya yang tidak ada.
          #   denied/unauthorized -> soal IZIN; tagnya belum sempat dicari.
          #
          # Pernah salah dibaca: `docker login` yang berhasil sempat dianggap
          # membuktikan hak menarik, padahal tarikan lokal membalas 403 karena
          # token `gh` tidak bercakupan `read:packages`.
          if grep -qi "manifest unknown" "$RUNNER_TEMP/tarik.err"; then
            echo "::error::Tidak ada citra bertag itu. Kredensialnya DITERIMA - yang tidak ada TAGnya. Kemungkinan besar SHA-nya memang belum pernah membangun citra (ADR-018 melewati commit dokumen). Ambil SHA dari ringkasan jalan 'Rilis citra' terakhir yang hijau."
          elif grep -qiE "denied|unauthorized" "$RUNNER_TEMP/tarik.err"; then
            echo "::error::Registry MENOLAK - ini soal izin, bukan soal tag. Periksa 'packages: read' pada workflow ini."
          fi

          exit 1

      - name: Jalankan bundel migrasi
        env:
          POSTGRES: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$POSTGRES" ]; then
            echo "::error::Secret NEON_DATABASE_URL belum diisi."
            exit 1
          fi

          # Bentuk URI dari Neon diterima apa adanya - aplikasi
          # menerjemahkannya sendiri (PostgresConnectionString), sebab Npgsql
          # melempar untuk URI.
          docker run --rm \
            -e "ConnectionStrings__Postgres=$POSTGRES" \
            --entrypoint /app/efbundle \
            "${{ steps.nama.outputs.citra }}"

      - name: Ringkasan
        run: |
          {
            echo "### Migrasi selesai"
            echo
            echo "Citra: \`${{ steps.nama.outputs.citra }}\`"
            echo
            echo "Langkah berikutnya: pasang ref citra di atas **apa adanya** di Koyeb."
            echo
            echo "> ⚠️ **Salin ref lengkapnya, jangan SHA pendek.** Tag di registry"
            echo "> selalu SHA 40 karakter. Langkah ini boleh menerima SHA pendek"
            echo "> karena ia mengkanonikalkannya sendiri; **Koyeb tidak**, dan"
            echo "> di sana SHA pendek berujung \`manifest unknown\` - galat yang"
            echo "> terbaca seperti \"citranya belum terbit\" padahal citranya ada."
            echo
            echo "Memasang SHA yang berbeda dari yang baru saja dimigrasikan"
            echo "adalah cara paling mudah membuat skema dan kode tidak sejalan."
          } >> "$GITHUB_STEP_SUMMARY"
