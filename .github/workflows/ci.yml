# CI — KERANGKA.md 4.12.
#
# Blueprint mendaftar sembilan gerbang: Lint · Unit Test · Integration Test ·
# Contract Test · SAST · Dependency Scan · Secret Scan · Container Scan · Build.
# Yang MENYALA di sini sudah DELAPAN. Tiga menyusul pada 2026-09-07:
#   - Integration Test, begitu ada yang benar-benar bisa diperiksa: kesiapan API
#     tanpa Redis, yang menentukan apakah penyebaran bisa selesai sama sekali.
#   - Build citra peti kemas, begitu Dockerfile-nya ada.
#   - Container Scan, begitu ada citra yang bisa dipindai. Gerbang ini langsung
#     berbuah: ia menemukan npm ikut terbawa citra web dan membawa 11 dari 13
#     temuan CRITICAL/HIGH - termasuk satu-satunya CRITICAL - padahal
#     `node server.js` tidak pernah memanggilnya. Sesudah npm dibuang: 0.
# Yang BELUM: Contract Test - belum ada kontrak antar-layanan.
# Gerbang yang selalu hijau karena tidak memeriksa apa pun lebih berbahaya
# daripada tidak ada.

name: CI

on:
  # 🔴 `push` hanya untuk main. Sampai 2026-09-28 cabang fase-*/** ikut di sini,
  # jadi setiap push ke cabang ber-PR menjalankan CI DUA kali - `push` dan
  # `pull_request` untuk commit yang sama. Diukur atas run 1-12 September (menit
  # dibulatkan per job, cara GitHub menagih): 30 dari 63 commit berjalan ganda,
  # dan jalan `push` tambahannya memakan 147 menit - seperempat pemakaian repo
  # ini bulan itu, dari kuota 2.000 menit yang dibagi SEMUA repo privat akun ini
  # (#57, ADR-026). Cakupannya tidak berkurang: jalan `pull_request` menguji
  # hasil penggabungan, lebih kuat daripada ujung cabang. Cabang tanpa PR tidak
  # diperiksa di sini - untuk itu ada CI mandiri, `.\run.ps1 ci` / `make ci`.
  push:
    branches: [main]
  # PR yang menyasar cabang fase-* ikut diperiksa, bukan cuma yang menyasar main.
  # Tanpa baris ini, PR bertumpuk (mis. #25 -> fase-1/skeleton) tidak diperiksa
  # sama sekali.
  pull_request:
    branches: [main, "fase-*/**"]
  # Jalan tangan dari tab Actions, tanpa commit kosong.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  backend:
    name: Backend (.NET)
    # 🔑 Runner disematkan per versi, bukan `ubuntu-latest` - sejak 2026-09-29,
    # di keenam `runs-on` ketiga workflow. Label `ubuntu-latest` pindah ke Ubuntu
    # 26.04 BERGILIR antara 19 Oktober dan 19 November 2026
    # (actions/runner-images#14748): selama sebulan itu jalan yang sama bisa
    # mendarat di dua OS berbeda, dan merah di sana punya dua tersangka.
    #
    # 24.04 dipilih karena di situlah SEMUA jalan hijau sampai hari ini - termasuk
    # rilis-citra.yml dan migrasi-produksi.yml, yang tidak bisa diuji ulang tanpa
    # mendorong citra atau tanpa secret Neon. 26.04 sudah DIUKUR untuk berkas ini:
    # keempat job hijau di sana (run 36512838453, citra runner 20260920.143.1).
    # Pindah = mengganti label di keenam tempat itu. ADR-026, Pembaruan 2026-09-29.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techversex
          POSTGRES_USER: techversex
          POSTGRES_PASSWORD: techversex_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techversex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Pasang .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TechVerseX.slnx

      # Build sudah memuat tiga gerbang sekaligus:
      #   - Lint/style  → EnforceCodeStyleInBuild + TreatWarningsAsErrors
      #   - SAST ringan → analyzer .NET (AnalysisLevel latest-recommended)
      #   - Dependency  → NuGetAudit menggagalkan build pada paket rentan
      - name: Build (peringatan = galat)
        run: dotnet build TechVerseX.slnx --no-restore --configuration Release

      # 🔴 MIGRASI SEBELUM UJI, dan urutannya bukan selera.
      #
      # Service container `postgres` di atas menyala KOSONG. Sampai 2026-09-08
      # langkah ini ada SESUDAH uji, dan itu tidak ketahuan karena satu-satunya
      # uji integrasi yang ada cuma menyentuh /health/ready - yang memakai
      # AddDbContextCheck, dan itu hanya menguji KONEKSI, bukan keberadaan tabel.
      # Uji pertama yang benar-benar menulis baris langsung memerah dengan
      # `relation "technology.technologies" does not exist`.
      #
      # Urutan ini sekaligus menyamakan CI dengan urutan yang PENYEBARAN.md
      # wajibkan di produksi: postgres -> migrate -> api. CI yang menjalankan
      # urutan berbeda dari produksi adalah CI yang mengukur keadaan lain.
      #
      # "Dari nol" tetap terjaga: basis datanya masih kosong saat langkah ini
      # berjalan - uji baru menyentuhnya sesudah ini.
      - name: Migrasi bisa dijalankan dari nol
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project services/technology/TechVerseX.TechnologyService.csproj \
            --startup-project apps/api/TechVerseX.Api.csproj
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=techversex;Username=techversex;Password=techversex_dev"
          ConnectionStrings__Redis: "localhost:6379"

      # Uji unit DAN uji integrasi. Yang kedua menyalakan host sungguhan lewat
      # WebApplicationFactory dan menyentuh service container `postgres` di atas,
      # jadi langkah ini tidak lagi bebas-infrastruktur - ia menuntut skema yang
      # baru saja dibuat langkah di atasnya.
      - name: Uji unit + integrasi
        run: dotnet test TechVerseX.slnx --no-build --configuration Release --verbosity normal

      # 🔑 GERBANG ADR-027: isi SUNGGUHAN (berkas di isi/) bisa dipasang ke API
      # sungguhan, dari nol, dua kali.
      #
      # Kenapa gerbang tersendiri dan bukan cukup `cek:isi` di job frontend: pemeriksa
      # itu mencerminkan batas panjang dan aturan bentuk, dan cermin bisa menyimpang
      # dari server. Di sini SERVERNYA yang menilai — validator, aturan domain, dan
      # `MarkDrafted` yang menolak bagian kosong. Jalan produksi (isi.yml) tidak bisa
      # diuji tanpa secret Neon, jadi inilah satu-satunya tempat berkas isi bertemu API
      # sebelum ia bertemu produksi.
      #
      # Basis data TERPISAH (techversex_isi) di service container yang sama: uji integrasi
      # di atas sudah menulis ke `techversex`, dan "dari nol" tak boleh bergantung pada
      # sisa uji lain. Pemasangan KEDUA harus tidak menulis apa pun — pemasang yang
      # menggandakan langkah pada pemasangan ulang adalah cacat yang sudah pernah
      # menggigit seed (database/seeds/seed.mjs).
      - name: Isi sungguhan dipasang dari nol, dua kali (ADR-027)
        env:
          PGPASSWORD: techversex_dev
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=techversex_isi;Username=techversex;Password=techversex_dev"
          ConnectionStrings__Redis: "localhost:6379"
          Editorial__WritesEnabled: "true"
          API_BASE_URL: "http://127.0.0.1:5099"
        run: |
          psql -h localhost -U techversex -d techversex -c 'CREATE DATABASE techversex_isi'
          dotnet ef database update \
            --project services/technology/TechVerseX.TechnologyService.csproj \
            --startup-project apps/api/TechVerseX.Api.csproj

          dotnet run --project apps/api/TechVerseX.Api.csproj --no-build --configuration Release \
            --no-launch-profile --urls "$API_BASE_URL" > "$RUNNER_TEMP/api-isi.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api-isi.pid"

          siap=""
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE_URL/health/ready")" = "200" ]; then
              siap="ya"
              break
            fi
            sleep 2
          done
          if [ -z "$siap" ]; then
            echo "::error::API tidak pernah SIAP dalam 60 detik. Log-nya dicetak di langkah Bersihkan."
            exit 1
          fi

          echo "=== Pemasangan pertama (dari nol)"
          node database/isi/pasang.mjs --semua

          echo "=== Pemasangan kedua (tak boleh menulis apa pun)"
          node database/isi/pasang.mjs --semua | tee "$RUNNER_TEMP/pasang-kedua.txt"
          if grep -E '^  (dibuat|langkah|proyek|sumber|sisi|draf|ganti|buang|lepas)' "$RUNNER_TEMP/pasang-kedua.txt"; then
            echo "::error::Pemasangan kedua menulis sesuatu. Pemasang harus idempoten: berkas yang sama, server yang sama, nol tulisan."
            exit 1
          fi

          # Invarian inti ADR-027: pemasang membawa topik paling jauh ke draf. Tak satu
          # topik pun boleh keluar dari sini berstatus tinjau atau berpemeriksa.
          jumlah=0
          for berkas in isi/*/*.json; do
            slug="$(basename "$berkas" .json)"
            badan="$(curl -s "$API_BASE_URL/api/v1/technologies/$slug")"
            echo "$badan" | grep -q '"maturity":"MachineDrafted"' || { echo "::error::$slug tidak berstatus draf: $badan"; exit 1; }
            echo "$badan" | grep -q '"reviewedAt":null' || { echo "::error::$slug punya reviewedAt — pemasang tak boleh menandai diperiksa."; exit 1; }
            jumlah=$((jumlah + 1))
          done
          echo "SIAP: $jumlah topik terpasang dari nol, sama dengan berkas, berstatus draf."

      # 🔑 GERBANG ADR-028 Tahap 2: `pasang.mjs --ganti` membuktikan dirinya terhadap API
      # SUNGGUHAN, di basis data yang baru saja diisi langkah di atas. Skrip itu
      # menyimpangkan server dari berkas lewat API, lalu memeriksa tiap akibatnya: tanpa
      # --ganti pemasang berhenti dan tak menulis; dengan --ganti server kembali sama dengan
      # berkas dan idempoten; topik tinjau tetap terkunci; langkah roadmap berlebih tetap
      # menghentikan. Ia sengaja SESUDAH pemeriksaan "semua topik draf" di atas: ia
      # menaikkan satu topik ke tinjau untuk membuktikan kuncinya, dan basis data ini
      # sekali pakai (techversex_isi, lahir kosong tiap jalan).
      - name: Isi sungguhan diganti, tinjau tetap terkunci (ADR-028 Tahap 2)
        env:
          API_BASE_URL: "http://127.0.0.1:5099"
        run: node database/isi/uji-ganti.mjs

      - name: Bersihkan API isi
        if: always()
        run: |
          tail -n 40 "$RUNNER_TEMP/api-isi.log" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/api-isi.pid" ]; then kill "$(cat "$RUNNER_TEMP/api-isi.pid")" 2>/dev/null || true; fi

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04 # disematkan - alasannya di job `backend`

    steps:
      - uses: actions/checkout@v5

      - name: Pasang Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Sengaja SEBELUM `npm ci`: pemeriksanya nol dependensi, jadi menaruhnya di
      # sini membuat gerbang dokumen gagal dalam hitungan detik alih-alih sesudah
      # pemasangan paket. Alasan aturannya ada di kepala skripnya.
      - name: Cek tautan Markdown
        run: npm run cek:tautan

      # Sama alasannya: nol dependensi, jadi berkas isi yang cacat gagal dalam hitungan
      # detik, sebelum `npm ci`. Ia memeriksa SEMUA berkas isi/ (ADR-027); bahwa server
      # sungguhan menerimanya dibuktikan job `backend`, langkah "Isi sungguhan".
      - name: Cek berkas isi
        run: npm run cek:isi

      # Pengurai Markdown terbatas (ADR-028 Tahap 3a) dipakai penampil web DAN pemeriksa
      # berkas isi di atas, jadi ujinya duduk di sini juga: nol dependensi (`node:test`),
      # sebelum `npm ci`. Isinya termasuk uji acak yang menjaga dua sifat kunci — pengurai
      # tak pernah melempar, dan keluarannya tak pernah membawa tautan selain http(s).
      - name: Uji pengurai Markdown
        run: npm run test:markdown

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web

  secret-scan:
    name: Pindai rahasia
    runs-on: ubuntu-24.04 # disematkan - alasannya di job `backend`

    # CLI gitleaks sebagai peti kemas, BUKAN gitleaks-action - sejak 2026-09-28.
    # Tiga alasan:
    #   1. Aksi pihak ketiga yang dijalankan dengan GITHUB_TOKEN diganti peti kemas
    #      tanpa token dan tanpa izin tambahan: `pull-requests: read` ikut hilang.
    #   2. Perintah yang SAMA dengan .github/scripts/gerbang-ci-lokal.sh, digest sama.
    #   3. gitleaks-action bukan lagi MIT sejak v2, dan menuntut GITLEAKS_LICENSE
    #      begitu repo dimiliki ORGANISASI (lewat pendaftaran di gitleaks.io). Repo
    #      ini tetap di akun pribadi (ADR-026), tapi gerbang rahasia tidak boleh
    #      bisa merah hanya karena repo dipindah. CLI-nya MIT, tanpa kunci.
    #
    # Seluruh riwayat (fetch-depth 0), bukan hanya commit PR: diukur 2026-09-28,
    # 80-82 commit dalam 0,3-22 detik. Citra ini berjalan sebagai root atas repo
    # milik pengguna runner; ia memasang `safe.directory = *` sendiri, dan
    # kondisinya ditiru di Linux (WSL, repo uid 1000, peti kemas uid 0): 82 commit
    # dipindai, bukan nol. Merahnya dibuktikan dengan rahasia palsu di klona
    # sekali pakai: "leaks found: 1", exit 1.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks (seluruh riwayat)
        run: |
          docker run --rm -v "$PWD:/repo"             zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f             git /repo --redact --no-banner --exit-code 1

  citra:
    name: Citra peti kemas
    runs-on: ubuntu-24.04 # disematkan - alasannya di job `backend`

    # Hanya pada PR. Di `main`, workflow `rilis-citra.yml` sudah membangun
    # ketiganya sebelum mendorongnya - membangunnya dua kali cuma menghabiskan
    # menit runner tanpa menambah satu pun jaminan.
    if: github.event_name == 'pull_request'

    # Dockerfile yang tidak pernah dibangun CI akan membusuk diam-diam, dan
    # ketahuannya justru saat menyebarkan - saat paling mahal untuk tahu.
    #
    # Isinya juga DIPINDAI di sini (Container Scan, gerbang ke-8 dari daftar
    # KERANGKA.md 4.12). Ambangnya CRITICAL+HIGH dan ia MENGGAGALKAN build -
    # jujur karena ketiga citra terukur NOL pada ambang itu saat gerbangnya
    # dipasang. Gerbang yang dipasang di atas temuan yang sudah ada akan
    # dilonggarkan orang di hari pertama; yang ini tidak punya utang.
    steps:
      - uses: actions/checkout@v5

      - name: Citra API
        run: docker build -f apps/api/Dockerfile --target final -t techversex-api:ci .

      # Tahap terpisah dengan restore ber-RID sendiri; gampang rusak tanpa
      # disadari kalau tidak ikut dibangun.
      - name: Bundel migrasi
        run: docker build -f apps/api/Dockerfile --target migrator -t techversex-migrate:ci .

      - name: Citra web
        run: docker build -f apps/web/Dockerfile -t techversex-web:ci .

      # Gerbang ADR-020 di tingkat CITRA. Uji integrasi membuktikannya di tingkat
      # KODE, dengan host yang dirakit sendiri lewat WebApplicationFactory - yang
      # tidak bisa melihat apakah artefak yang benar-benar disebarkan membawa
      # sesuatu yang membukanya lagi. Alasannya lengkap ada di skripnya.
      - name: Citra API menolak menulis (ADR-020)
        run: bash .github/scripts/periksa-permukaan-tulis.sh techversex-api:ci

      # Gerbang ADR-024: aturan teks pembaca dan penelusuran halaman, diukur di
      # BENTUK PRODUKSI - tumpukan yang sama dengan yang akan tayang, bukan host
      # rakitan dan bukan `next dev`.
      #
      # 🔑 Kenapa di job INI dan bukan di `frontend`: pemindainya menuntut web
      # yang sudah jadi DAN API yang hidup. Job `frontend` tidak punya keduanya,
      # sedangkan job ini sudah membangun ketiga citranya beberapa langkah di
      # atas - jadi `compose up` di sini menabrak cache build, bukan membangun
      # ulang. Ketiga target compose sama persis dengan ketiga `docker build` di
      # atas (`final`, `migrator`, dan Dockerfile web).
      #
      # 🔑 Bentuk produksi juga yang paling MURAH dijaga: nol topik dan empat
      # belas bidang datang dari migrasi, tanpa seed, jadi angkanya deterministik.
      # Diukur lokal terhadap tumpukan ini: 16 halaman, 14 dari 14 halaman
      # /teknologi/* yang dikenal API, teks terlihat 0 kena. Sejak 2026-10-07 (tiga bidang
      # Deep Tech, ADR-010 Pembaruan): 19 halaman, 17 dari 17. Pemindainya menghitung dari
      # API, jadi angka ini hanya catatan — tak ada yang perlu disetel di sini.
      - name: Pasang Node untuk pemindai halaman
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # `--build` tidak mengubah apa pun DI SINI - runner lahir tanpa citra
      # techversex-prod-*, jadi compose membangunnya juga, dari cache langkah di
      # atas. Ia ada untuk orang yang MENYALIN baris ini ke mesinnya: tanpa
      # `--build`, compose diam-diam memakai citra techversex-prod-* lama yang
      # sudah ada. Terjadi 2026-09-24 - tiruan lokal job ini menguji citra
      # 17 September, bukan kode yang sedang di-commit.
      - name: Tumpukan produksi hidup
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Teks pembaca dan penelusuran halaman (ADR-024)
        env:
          WEB_BASE_URL: http://localhost:8080
          API_BASE_URL: http://localhost:8081
        run: node .github/scripts/periksa-halaman-web.mjs

      # `always()`: kalau gerbang di atas merah, log peti kemasnya yang paling
      # berguna - dan volume yang tertinggal akan membuat jalan berikutnya
      # memigrasi basis data yang SUDAH terisi, jadi "migrasi dari nol" berhenti
      # terukur.
      - name: Log tumpukan produksi, lalu bongkar
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml logs --no-color --tail 60
          docker compose -f docker-compose.prod.yml down -v

      # Trivy dijalankan sebagai peti kemas, bukan lewat action pihak ketiga:
      # gerbang ini tidak butuh satu pun izin tambahan, dan tidak menambah
      # aksi yang harus dipercaya. `--exit-code 1` yang membuatnya menggigit -
      # tanpa itu ia cuma mencetak laporan dan selalu hijau.
      #
      # 🔴 Disematkan per versi DAN digest, bukan `:latest`. Maret 2026 Trivy
      # disusupi (GHSA-69fq-xp46-6x23 / CVE-2026-33634): citra v0.69.4-v0.69.6 -
      # dan `latest` selama jendela paparan - membawa pencuri kredensial, dan
      # langkah ini memasang soket Docker ke dalamnya. Advisory itu sendiri
      # menyebut citra yang dirujuk lewat DIGEST tidak terkena. Digest yang sama
      # dipakai .github/scripts/gerbang-ci-lokal.sh; naikkan keduanya bersamaan.
      - name: Pindai ketiga citra
        run: |
          for citra in techversex-api:ci techversex-migrate:ci techversex-web:ci; do
            echo "::group::$citra"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --no-progress \
                "$citra"
            echo "::endgroup::"
          done
