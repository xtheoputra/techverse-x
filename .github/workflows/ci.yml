# CI — KERANGKA.md 4.12.
#
# Blueprint mendaftar sembilan gerbang: Lint · Unit Test · Integration Test ·
# Contract Test · SAST · Dependency Scan · Secret Scan · Container Scan · Build.
# Yang MENYALA di sini sudah DELAPAN. Tiga menyusul pada 2026-09-07:
#   - Integration Test, begitu ada yang benar-benar bisa diperiksa: kesiapan API
#     tanpa Redis, yang menentukan apakah penyebaran bisa selesai sama sekali.
#   - Build citra peti kemas, begitu Dockerfile-nya ada.
#   - Container Scan, begitu ada citra yang bisa dipindai. Gerbang ini langsung
#     berbuah: ia menemukan npm ikut terbawa citra web dan membawa 11 dari 13
#     temuan CRITICAL/HIGH - termasuk satu-satunya CRITICAL - padahal
#     `node server.js` tidak pernah memanggilnya. Sesudah npm dibuang: 0.
# Yang BELUM: Contract Test - belum ada kontrak antar-layanan.
# Gerbang yang selalu hijau karena tidak memeriksa apa pun lebih berbahaya
# daripada tidak ada.

name: CI

on:
  push:
    branches: [main, "fase-*/**"]
  # PR yang menyasar cabang fase-* ikut diperiksa, bukan cuma yang menyasar main.
  # Tanpa baris kedua, PR bertumpuk (mis. #25 -> fase-1/skeleton) hanya kebagian
  # jalan `push`, yang menguji ujung cabangnya - BUKAN hasil penggabungannya.
  pull_request:
    branches: [main, "fase-*/**"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: techversex
          POSTGRES_USER: techversex
          POSTGRES_PASSWORD: techversex_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techversex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Pasang .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TechVerseX.slnx

      # Build sudah memuat tiga gerbang sekaligus:
      #   - Lint/style  → EnforceCodeStyleInBuild + TreatWarningsAsErrors
      #   - SAST ringan → analyzer .NET (AnalysisLevel latest-recommended)
      #   - Dependency  → NuGetAudit menggagalkan build pada paket rentan
      - name: Build (peringatan = galat)
        run: dotnet build TechVerseX.slnx --no-restore --configuration Release

      # 🔴 MIGRASI SEBELUM UJI, dan urutannya bukan selera.
      #
      # Service container `postgres` di atas menyala KOSONG. Sampai 2026-09-08
      # langkah ini ada SESUDAH uji, dan itu tidak ketahuan karena satu-satunya
      # uji integrasi yang ada cuma menyentuh /health/ready - yang memakai
      # AddDbContextCheck, dan itu hanya menguji KONEKSI, bukan keberadaan tabel.
      # Uji pertama yang benar-benar menulis baris langsung memerah dengan
      # `relation "technology.technologies" does not exist`.
      #
      # Urutan ini sekaligus menyamakan CI dengan urutan yang PENYEBARAN.md
      # wajibkan di produksi: postgres -> migrate -> api. CI yang menjalankan
      # urutan berbeda dari produksi adalah CI yang mengukur keadaan lain.
      #
      # "Dari nol" tetap terjaga: basis datanya masih kosong saat langkah ini
      # berjalan - uji baru menyentuhnya sesudah ini.
      - name: Migrasi bisa dijalankan dari nol
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project services/technology/TechVerseX.TechnologyService.csproj \
            --startup-project apps/api/TechVerseX.Api.csproj
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=techversex;Username=techversex;Password=techversex_dev"
          ConnectionStrings__Redis: "localhost:6379"

      # Uji unit DAN uji integrasi. Yang kedua menyalakan host sungguhan lewat
      # WebApplicationFactory dan menyentuh service container `postgres` di atas,
      # jadi langkah ini tidak lagi bebas-infrastruktur - ia menuntut skema yang
      # baru saja dibuat langkah di atasnya.
      - name: Uji unit + integrasi
        run: dotnet test TechVerseX.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pasang Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Sengaja SEBELUM `npm ci`: pemeriksanya nol dependensi, jadi menaruhnya di
      # sini membuat gerbang dokumen gagal dalam hitungan detik alih-alih sesudah
      # pemasangan paket. Alasan aturannya ada di kepala skripnya.
      - name: Cek tautan Markdown
        run: npm run cek:tautan

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web

  secret-scan:
    name: Pindai rahasia
    runs-on: ubuntu-latest

    # Pada kejadian `pull_request`, gitleaks-action MEMBACA daftar commit PR lewat
    # API (`GET /repos/{owner}/{repo}/pulls/{pull_number}/commits`) sebelum
    # memindai apa pun. Dengan `contents: read` saja panggilan itu ditolak 403 dan
    # langkahnya mati walau tidak ada satu pun rahasia. Yang dibutuhkan hanya izin
    # BACA; menulis komentar PR sengaja dimatikan di bawah.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Komentar PR menuntut `pull-requests: write` untuk aksi pihak ketiga —
          # harga yang tidak sepadan, karena temuan tetap tampil UTUH di job
          # summary (aturan, commit, berkas, baris, penulis) dan kebocoran tetap
          # menggagalkan gerbang ini lewat exit code.
          GITLEAKS_ENABLE_COMMENTS: "false"

  citra:
    name: Citra peti kemas
    runs-on: ubuntu-latest

    # Hanya pada PR. Di `main`, workflow `rilis-citra.yml` sudah membangun
    # ketiganya sebelum mendorongnya - membangunnya dua kali cuma menghabiskan
    # menit runner tanpa menambah satu pun jaminan.
    if: github.event_name == 'pull_request'

    # Dockerfile yang tidak pernah dibangun CI akan membusuk diam-diam, dan
    # ketahuannya justru saat menyebarkan - saat paling mahal untuk tahu.
    #
    # Isinya juga DIPINDAI di sini (Container Scan, gerbang ke-8 dari daftar
    # KERANGKA.md 4.12). Ambangnya CRITICAL+HIGH dan ia MENGGAGALKAN build -
    # jujur karena ketiga citra terukur NOL pada ambang itu saat gerbangnya
    # dipasang. Gerbang yang dipasang di atas temuan yang sudah ada akan
    # dilonggarkan orang di hari pertama; yang ini tidak punya utang.
    steps:
      - uses: actions/checkout@v5

      - name: Citra API
        run: docker build -f apps/api/Dockerfile --target final -t techversex-api:ci .

      # Tahap terpisah dengan restore ber-RID sendiri; gampang rusak tanpa
      # disadari kalau tidak ikut dibangun.
      - name: Bundel migrasi
        run: docker build -f apps/api/Dockerfile --target migrator -t techversex-migrate:ci .

      - name: Citra web
        run: docker build -f apps/web/Dockerfile -t techversex-web:ci .

      # Gerbang ADR-020 di tingkat CITRA. Uji integrasi membuktikannya di tingkat
      # KODE, dengan host yang dirakit sendiri lewat WebApplicationFactory - yang
      # tidak bisa melihat apakah artefak yang benar-benar disebarkan membawa
      # sesuatu yang membukanya lagi. Alasannya lengkap ada di skripnya.
      - name: Citra API menolak menulis (ADR-020)
        run: bash .github/scripts/periksa-permukaan-tulis.sh techversex-api:ci

      # Gerbang ADR-024: aturan teks pembaca dan penelusuran halaman, diukur di
      # BENTUK PRODUKSI - tumpukan yang sama dengan yang akan tayang, bukan host
      # rakitan dan bukan `next dev`.
      #
      # 🔑 Kenapa di job INI dan bukan di `frontend`: pemindainya menuntut web
      # yang sudah jadi DAN API yang hidup. Job `frontend` tidak punya keduanya,
      # sedangkan job ini sudah membangun ketiga citranya beberapa langkah di
      # atas - jadi `compose up` di sini menabrak cache build, bukan membangun
      # ulang. Ketiga target compose sama persis dengan ketiga `docker build` di
      # atas (`final`, `migrator`, dan Dockerfile web).
      #
      # 🔑 Bentuk produksi juga yang paling MURAH dijaga: nol topik dan empat
      # belas bidang datang dari migrasi, tanpa seed, jadi angkanya deterministik.
      # Diukur lokal terhadap tumpukan ini: 16 halaman, 14 dari 14 halaman
      # /teknologi/* yang dikenal API, teks terlihat 0 kena.
      - name: Pasang Node untuk pemindai halaman
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # `--build` tidak mengubah apa pun DI SINI - runner lahir tanpa citra
      # techversex-prod-*, jadi compose membangunnya juga, dari cache langkah di
      # atas. Ia ada untuk orang yang MENYALIN baris ini ke mesinnya: tanpa
      # `--build`, compose diam-diam memakai citra techversex-prod-* lama yang
      # sudah ada. Terjadi 2026-09-24 - tiruan lokal job ini menguji citra
      # 17 September, bukan kode yang sedang di-commit.
      - name: Tumpukan produksi hidup
        run: docker compose -f docker-compose.prod.yml up -d --build --wait

      - name: Teks pembaca dan penelusuran halaman (ADR-024)
        env:
          WEB_BASE_URL: http://localhost:8080
          API_BASE_URL: http://localhost:8081
        run: node .github/scripts/periksa-halaman-web.mjs

      # `always()`: kalau gerbang di atas merah, log peti kemasnya yang paling
      # berguna - dan volume yang tertinggal akan membuat jalan berikutnya
      # memigrasi basis data yang SUDAH terisi, jadi "migrasi dari nol" berhenti
      # terukur.
      - name: Log tumpukan produksi, lalu bongkar
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml logs --no-color --tail 60
          docker compose -f docker-compose.prod.yml down -v

      # Trivy dijalankan sebagai peti kemas, bukan lewat action pihak ketiga:
      # gerbang ini tidak butuh satu pun izin tambahan, dan tidak menambah
      # aksi yang harus dipercaya. `--exit-code 1` yang membuatnya menggigit -
      # tanpa itu ia cuma mencetak laporan dan selalu hijau.
      - name: Pindai ketiga citra
        run: |
          for citra in techversex-api:ci techversex-migrate:ci techversex-web:ci; do
            echo "::group::$citra"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --no-progress \
                "$citra"
            echo "::endgroup::"
          done
