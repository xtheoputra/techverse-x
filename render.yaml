# Blueprint Render — infrastruktur TechVerse X sebagai berkas, bukan sebagai
# klik yang tidak ada jejaknya.
#
# Keputusannya ada di docs/adr/ADR-017-platform-hosting.md; runbook netral
# platform ada di docs/PENYEBARAN.md. Berkas ini implementasi Render-nya saja -
# ia TIDAK mengunci apa pun, karena citranya tetap di GHCR dan bisa ditarik
# platform mana pun.
#
# Cara memakainya ada di docs/PENYEBARAN.md bagian "Menyebarkan ke Render".
#
# ⚠️ EMPAT NILAI DI BAWAH HARUS DIISI PEMILIK sebelum blueprint ini dipakai.
#    Semuanya ditandai GANTI:
#      1. <SHA>        - tag citra yang mau dipasang
#      2. <CRED-ID>    - id kredensial registry GHCR di dashboard Render
#      3. plan/region  - periksa ke halaman harga; nama plan bisa berubah
#
# ⚠️ NAMA PLAN DAN REGION DI SINI BELUM PERNAH DIVERIFIKASI KE AKUN SUNGGUHAN.
#    Render menolak blueprint dengan nama plan yang tidak dikenal, dan itu
#    kegagalan yang murah - ia terjadi saat sync, bukan saat tayang.

databases:
  # Postgres TERKELOLA. Ini setengah alasan memilih Render (ADR-017): cadangan
  # dan pemulihan titik-waktu dikerjakan platform, bukan oleh satu orang.
  #
  # ⚠️ JANGAN pakai tier gratisnya: ia KEDALUWARSA 30 hari setelah dibuat, lalu
  # datanya dihapus setelah 14 hari masa tenggang. Itu bukan basis data, itu
  # hitungan mundur.
  - name: techversex-db
    databaseName: techversex
    user: techversex
    plan: basic-256mb # GANTI kalau nama plan berbeda di halaman harga
    region: singapore # terdekat ke pembaca Indonesia; ukur, jangan tebak

services:
  # ---------------------------------------------------------------------------
  # API. Ia yang memegang pre-deploy, karena bundel migrasinya ikut di citranya
  # (ADR-017 opsi C) - dan pre-deploy Render berjalan di citra layanan ITU
  # SENDIRI, bukan citra lain.
  # ---------------------------------------------------------------------------
  - type: web
    name: techversex-api
    runtime: image
    plan: starter # BUKAN free: free tidur 15 menit lalu cold start 30-60 detik
    region: singapore
    image:
      url: ghcr.io/xtheoputra/techverse-x/api:<SHA> # GANTI
      creds: <CRED-ID> # GANTI - kredensial GHCR, butuh cakupan read:packages

    # 🔴 INILAH yang menegakkan urutan `migrate -> api` di Render.
    # Ia berjalan SEKALI PER PENYEBARAN, bukan sekali per instans - jadi
    # larangan "migrasi di startup API" (PENYEBARAN.md) tetap utuh: dua instans
    # tidak akan pernah berlomba mengubah skema.
    # Kalau ia gagal, penyebarannya berhenti dan versi lama tetap melayani.
    preDeployCommand: /app/efbundle

    healthCheckPath: /health/ready

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Render menyerahkan nilai ini sebagai URI postgres://... Aplikasi
      # menerjemahkannya sendiri (PostgresConnectionString) karena Npgsql
      # MELEMPAR untuk bentuk URI - lihat ujinya, yang membuktikan itu.
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: techversex-db
          property: connectionString

      # ⚠️ ConnectionStrings__Redis SENGAJA TIDAK ADA DI SINI.
      # ADR-016 memutuskan Redis tidak di-provision di V1, dan kesiapan API
      # sudah tahu cara hidup tanpanya. MENGISINYA dengan alamat mati jauh lebih
      # buruk daripada mengosongkannya: /health/ready akan merah selamanya dan
      # penyebaran tidak pernah selesai.

  # ---------------------------------------------------------------------------
  # Web.
  # ---------------------------------------------------------------------------
  - type: web
    name: techversex-web
    runtime: image
    plan: starter
    region: singapore
    image:
      url: ghcr.io/xtheoputra/techverse-x/web:<SHA> # GANTI
      creds: <CRED-ID> # GANTI

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0

      # Alamat internal API, dirakit Render dari layanan di atas.
      - key: API_BASE_URL
        fromService:
          name: techversex-api
          type: web
          property: hostport
# ⚠️ BATAS YANG SUDAH DIKETAHUI, dan sengaja tidak disembunyikan:
#
# Render TIDAK punya urutan antar-layanan. `techversex-web` bisa menyala sebelum
# `techversex-api` siap, jadi di penyebaran PERTAMA halaman ber-data bisa gagal
# beberapa saat sampai API hidup. docker-compose.prod.yml menegakkan urutan itu;
# Render tidak. Ini regresi kecil yang nyata - ditulis di sini supaya ditemukan
# sekarang, bukan saat menatap halaman yang error.
