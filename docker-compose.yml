# Infrastruktur pengembangan lokal — KERANGKA.md 4.12:
# "Development pakai Docker Compose. Jangan membuat production architecture
#  dan local architecture identik."
#
# Yang SENGAJA tidak ada di sini — masing-masing sudah DIPUTUSKAN, bukan terlupa.
# (Sampai 2026-09-28 baris ini menulis "keputusannya belum diambil", menyebut
# #15 masih terbuka padahal tutup 2026-09-04, dan menunjuk "ADR-0005" yang tidak
# ada.)
#   - Qdrant / pgvector   → ADR-005: pgvector tanpa Qdrant (#15), dipasang saat
#                           embedding pertama perlu disimpan; image di bawah
#                           sengaja postgres polos
#   - Neo4j               → ADR-006: sisi graf disimpan di PostgreSQL untuk V1
#   - NATS / Kafka        → ADR-004: event dikumpulkan di agregat, bus belum dipasang
#   - OpenSearch          → ADR-022: V1 memakai full-text search PostgreSQL

name: techversex

services:
  postgres:
    image: postgres:17-alpine
    container_name: techversex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techversex}
      POSTGRES_USER: ${POSTGRES_USER:-techversex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techversex_dev}
      # Setelan hanya untuk mesin lokal. Jangan disalin ke produksi.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techversex} -d ${POSTGRES_DB:-techversex}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: techversex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
