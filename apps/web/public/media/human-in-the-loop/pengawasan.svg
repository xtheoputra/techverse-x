<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="judul desk">
  <title id="judul">Angka tentang cara manusia mengawasi agen</title>
  <desc id="desk">Empat angka dari tulisan Anthropic. Pengguna Claude Code menyetujui 93 persen permintaan izin. Sesi dengan persetujuan otomatis penuh naik dari sekitar 20 persen pada pengguna baru menjadi lebih dari 40 persen pada pengguna dengan 750 sesi. Giliran yang diinterupsi pengguna naik dari 5 persen menjadi sekitar 9 persen seiring pengalaman. Pada tugas paling rumit, Claude Code berhenti untuk bertanya lebih dari dua kali lipat dibanding tugas paling sederhana. Kesimpulan: pengawasan yang efektif bukan menyetujui setiap aksi, tetapi berada di posisi untuk turun tangan saat diperlukan.</desc>
  <rect width="640" height="520" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Bagaimana manusia benar-benar mengawasi</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Data Claude Code dari Anthropic (Februari dan Maret 2026).</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <rect x="32" y="96" width="282" height="150" rx="14" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="48" y="122" fill="#98a3c4" font-size="13">permintaan izin yang disetujui</text>
    <text x="48" y="186" fill="#eef2ff" font-size="52" font-weight="700">93%</text>
    <text x="48" y="222" fill="#fecdd3" font-size="13">tanda kelelahan menyetujui</text>

    <rect x="326" y="96" width="282" height="150" rx="14" fill="#0d1226" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="342" y="122" fill="#98a3c4" font-size="13">sesi dengan persetujuan otomatis penuh</text>
    <text x="342" y="186" fill="#eef2ff" font-size="40" font-weight="700">20% → 40%+</text>
    <text x="342" y="222" fill="#a5f3fc" font-size="13">pengguna baru → 750 sesi</text>

    <rect x="32" y="258" width="282" height="150" rx="14" fill="#0d1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="48" y="284" fill="#98a3c4" font-size="13">giliran yang diinterupsi pengguna</text>
    <text x="48" y="348" fill="#eef2ff" font-size="44" font-weight="700">5% → 9%</text>
    <text x="48" y="384" fill="#ddd6fe" font-size="13">makin berpengalaman, makin sering</text>

    <rect x="326" y="258" width="282" height="150" rx="14" fill="#0d1226" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="342" y="284" fill="#98a3c4" font-size="13">agen berhenti untuk bertanya</text>
    <text x="342" y="348" fill="#eef2ff" font-size="44" font-weight="700">&gt; 2×</text>
    <text x="342" y="384" fill="#fde68a" font-size="13">tugas paling rumit vs paling sederhana</text>
  </g>

  <rect x="32" y="424" width="576" height="76" rx="14" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.5"/>
  <text x="48" y="452" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Yang pengguna berpengalaman lakukan</text>
  <text x="48" y="476" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13">Lebih sedikit menyetujui satu per satu, lebih sering memantau dan turun tangan.</text>
</svg>
