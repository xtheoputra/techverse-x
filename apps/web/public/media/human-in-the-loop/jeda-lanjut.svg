<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="judul desk">
  <title id="judul">Jeda dan lanjut: persetujuan yang bisa ditunggu berjam-jam</title>
  <desc id="desk">Enam langkah. Satu: model meminta pinjam_buku. Dua: kebijakan menilai tingkatnya tanya, sehingga putaran berhenti; tool otomatis di giliran yang sama sudah dijalankan dan hasilnya disimpan. Tiga: keadaan disimpan sebagai JSON, berisi riwayat pesan, tool yang menunggu, dan hasil sementara; prosesnya boleh berhenti. Empat: pengguna melihat ringkasan yang disusun kode dari argumen dan katalog, lalu memutuskan. Lima: keputusan diterapkan; bila setuju, tool dijalankan dengan cek ulang; bila ditolak atau kedaluwarsa, model menerima is_error berisi alasannya. Enam: semua tool_result giliran itu dikirim dalam satu pesan, dan putaran berlanjut. Setiap keputusan masuk jejak audit.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="600" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Jeda, simpan, lanjutkan</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Persetujuan boleh datang besok pagi, dari proses yang lain.</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <rect x="32" y="96" width="280" height="70" rx="12" fill="#0d1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="48" y="122" fill="#ddd6fe" font-size="15" font-weight="700">1 · Model meminta</text>
    <text x="48" y="146" fill="#98a3c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pinjam_buku(B-017, 7)</text>

    <rect x="328" y="96" width="280" height="70" rx="12" fill="#0d1226" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="344" y="122" fill="#fde68a" font-size="15" font-weight="700">2 · Kebijakan: tanya</text>
    <text x="344" y="146" fill="#98a3c4" font-size="13">tool otomatis tetap dijalankan</text>

    <path d="M312 131 H324" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>
    <path d="M468 168 V188" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>

    <rect x="32" y="192" width="576" height="92" rx="12" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="48" y="218" fill="#a5f3fc" font-size="15" font-weight="700">3 · Simpan keadaan sebagai JSON, proses boleh berhenti</text>
    <text x="48" y="242" fill="#c3cce6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">messages · menunggu [id, masukan, ringkasan, dibuat]</text>
    <text x="48" y="264" fill="#c3cce6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">hasil_sementara [hasil cari_buku, None]</text>

    <path d="M320 286 V306" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>

    <rect x="32" y="310" width="576" height="70" rx="12" fill="#0d1226" stroke="#34d399" stroke-width="1.5"/>
    <text x="48" y="336" fill="#a7f3d0" font-size="15" font-weight="700">4 · Anggota membaca ringkasan dari KODE, lalu memutuskan</text>
    <text x="48" y="360" fill="#98a3c4" font-size="13">"Pinjam "Laskar Pelangi" (B-017) untuk A-9 selama 7 hari, kembali 2026-10-16."</text>

    <path d="M320 382 V402" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>

    <rect x="32" y="406" width="280" height="96" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.5"/>
    <text x="48" y="432" fill="#a7f3d0" font-size="15" font-weight="700">5a · Setuju</text>
    <text x="48" y="456" fill="#98a3c4" font-size="13">jalankan dengan cek ulang:</text>
    <text x="48" y="476" fill="#98a3c4" font-size="13">stok bisa berubah selama menunggu</text>

    <rect x="328" y="406" width="280" height="96" rx="12" fill="#fb7185" fill-opacity="0.07" stroke="#fb7185" stroke-width="1.5"/>
    <text x="344" y="432" fill="#fecdd3" font-size="15" font-weight="700">5b · Tolak atau kedaluwarsa</text>
    <text x="344" y="456" fill="#98a3c4" font-size="13">model menerima is_error</text>
    <text x="344" y="476" fill="#98a3c4" font-size="13">berisi alasannya</text>

    <path d="M172 504 V524" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>
    <path d="M468 504 V524" stroke="#98a3c4" stroke-width="2" marker-end="url(#panah)"/>

    <rect x="32" y="528" width="576" height="52" rx="12" fill="#0d1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="48" y="552" fill="#ddd6fe" font-size="14" font-weight="700">6 · Semua tool_result giliran itu dalam SATU pesan → putaran lanjut</text>
    <text x="48" y="570" fill="#98a3c4" font-size="12">setiap keputusan masuk jejak audit: siapa, kapan, apa, setuju atau tolak</text>
  </g>
</svg>
