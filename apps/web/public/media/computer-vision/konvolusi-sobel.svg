<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="judul desk">
  <title id="judul">Filter Sobel mendeteksi tepi tegak</title>
  <desc id="desk">Kiri: gambar 6 kali 6 piksel, tiga kolom kiri gelap (0) dan tiga kolom kanan terang (1). Tengah: filter Sobel 3 kali 3 dengan baris minus 1, 0, 1; minus 2, 0, 2; minus 1, 0, 1. Kanan: hasil konvolusi 4 kali 4. Setiap baris bernilai 0, 4, 4, 0: angka besar hanya muncul tepat di batas gelap dan terang. Kotak kuning di gambar masukan menandai satu posisi filter, yang menghasilkan angka bertanda kuning di keluaran.</desc>
