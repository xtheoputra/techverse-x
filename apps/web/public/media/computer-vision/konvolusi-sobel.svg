  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Filter Sobel menemukan tepi</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Filter 3 × 3 digeser ke setiap posisi; di tiap posisi, kalikan lalu jumlahkan.</text>
