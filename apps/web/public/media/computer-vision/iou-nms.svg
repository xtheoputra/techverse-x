<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="judul desk">
  <title id="judul">Non-maximum suppression pada dua buku</title>
  <desc id="desk">Kiri, sebelum NMS: detektor mengusulkan empat kotak. Tiga kotak menumpuk di buku pertama dengan skor 0,90, 0,75, dan 0,60; satu kotak di buku kedua dengan skor 0,80. IoU kotak 0,90 dan 0,75 adalah 0,88. Kanan, sesudah NMS dengan ambang 0,5: kotak 0,75 dan 0,60 dibuang karena terlalu tumpang tindih dengan kotak 0,90; tersisa satu kotak per buku.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="450" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Satu buku, satu kotak</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Non-maximum suppression membuang kotak yang menumpuk.</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <text x="32" y="112" fill="#c3cce6" font-size="14" font-weight="700">sebelum: 4 calon</text>
    <rect x="64.0" y="164.0" width="76.0" height="144.0" rx="6" fill="#1c2340"/>
    <rect x="72.0" y="180.0" width="60.0" height="12.0" rx="3" fill="#2a3354"/>
    <rect x="200.0" y="164.0" width="64.0" height="144.0" rx="6" fill="#1c2340"/>
    <rect x="208.0" y="180.0" width="48.0" height="12.0" rx="3" fill="#2a3354"/>
    <rect x="52.0" y="148.0" width="100.0" height="160.0" fill="none" stroke="#3987e5" stroke-width="2.5" rx="3"/>
    <text x="52.0" y="142.0" fill="#3987e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,90</text>
    <rect x="56.0" y="144.0" width="100.0" height="160.0" fill="none" stroke="#fbbf24" stroke-width="2.5" rx="3"/>
    <text x="108.0" y="138.0" fill="#fbbf24" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,75</text>
    <rect x="48.0" y="156.0" width="100.0" height="160.0" fill="none" stroke="#a78bfa" stroke-width="2.5" rx="3"/>
    <text x="48.0" y="332.0" fill="#a78bfa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,60</text>
    <rect x="192.0" y="148.0" width="80.0" height="160.0" fill="none" stroke="#199e70" stroke-width="2.5" rx="3"/>
    <text x="192.0" y="142.0" fill="#199e70" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,80</text>
    <text x="352" y="112" fill="#c3cce6" font-size="14" font-weight="700">sesudah NMS (ambang 0,5): 2 kotak</text>
    <rect x="384.0" y="164.0" width="76.0" height="144.0" rx="6" fill="#1c2340"/>
    <rect x="392.0" y="180.0" width="60.0" height="12.0" rx="3" fill="#2a3354"/>
    <rect x="520.0" y="164.0" width="64.0" height="144.0" rx="6" fill="#1c2340"/>
    <rect x="528.0" y="180.0" width="48.0" height="12.0" rx="3" fill="#2a3354"/>
    <rect x="372.0" y="148.0" width="100.0" height="160.0" fill="none" stroke="#3987e5" stroke-width="2.5" rx="3"/>
    <text x="372.0" y="142.0" fill="#3987e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,90</text>
    <rect x="512.0" y="148.0" width="80.0" height="160.0" fill="none" stroke="#199e70" stroke-width="2.5" rx="3"/>
    <text x="512.0" y="142.0" fill="#199e70" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,80</text>
    <text x="32" y="358" fill="#c3cce6" font-size="13">IoU kotak 0,90 dan 0,75 = 0,88: lebih dari 0,5, jadi 0,75 dibuang. Begitu pula 0,60.</text>
    <text x="32" y="382" fill="#c3cce6" font-size="13">Kotak 0,80 di buku kedua tak bersentuhan dengan 0,90 (IoU 0), jadi ia disimpan.</text>
    <text x="32" y="418" fill="#98a3c4" font-size="12">Koordinat dan skor dari uji langkah 9; hasilnya sama dengan torchvision.ops.nms.</text>
  </g>
</svg>
