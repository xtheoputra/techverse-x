<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="judul desk">
  <title id="judul">Ukuran citra katalog</title>
  <desc id="desk">Grafik batang ukuran tiga citra katalog di disk. python:3.14 + dependensi: 1,68 GB di disk, 430,4 MB diunduh. python:3.14-slim + alat kompilasi: 697 MB di disk, 169,8 MB diunduh. multi-stage slim + hasil build: 248 MB di disk, 58,3 MB diunduh.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="350" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Ukuran citra katalog</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Aplikasi yang sama; yang berbeda adalah apa yang ikut dikirim.</text>
  <path d="M200.0 104 V286" stroke="#2a3354" stroke-width="1"/>
  <text x="200.0" y="304" fill="#98a3c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">0</text>
  <path d="M310.0 104 V286" stroke="#2a3354" stroke-width="1"/>
  <text x="310.0" y="304" fill="#98a3c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">0,6 GB</text>
  <path d="M420.0 104 V286" stroke="#2a3354" stroke-width="1"/>
  <text x="420.0" y="304" fill="#98a3c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">1,2 GB</text>
  <path d="M530.0 104 V286" stroke="#2a3354" stroke-width="1"/>
  <text x="530.0" y="304" fill="#98a3c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">1,8 GB</text>
  <text x="186" y="131" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">python:3.14</text>
  <text x="186" y="149" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="end">+ dependensi</text>
  <rect x="200" y="116" width="308.0" height="40" rx="6" fill="#f59e0b" fill-opacity="0.85"/>
  <text x="518.0" y="133" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">1,68 GB</text>
  <text x="518.0" y="150" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11">diunduh 430,4 MB</text>
  <text x="186" y="189" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">python:3.14-slim</text>
  <text x="186" y="207" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="end">+ alat kompilasi</text>
  <rect x="200" y="174" width="127.8" height="40" rx="6" fill="#a78bfa" fill-opacity="0.85"/>
  <text x="337.8" y="191" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">697 MB</text>
  <text x="337.8" y="208" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11">diunduh 169,8 MB</text>
  <text x="186" y="247" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">multi-stage</text>
  <text x="186" y="265" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="end">slim + hasil build</text>
  <rect x="200" y="232" width="45.5" height="40" rx="6" fill="#34d399" fill-opacity="0.85"/>
  <text x="255.5" y="249" fill="#eef2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">248 MB</text>
  <text x="255.5" y="266" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11">diunduh 58,3 MB</text>
  <text x="32" y="334" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12">Batang: ruang disk sesudah lapisan dibuka. Teks kecil: ukuran terkompresi yang lewat jaringan.</text>
</svg>
