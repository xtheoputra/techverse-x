  <text x="472.0" y="296.6" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Docker Engine</text>
  <rect x="344" y="318" width="256" height="40" rx="8" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.5"/>
  <text x="472.0" y="342.6" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">satu kernel Linux, dipakai bersama</text>
  <path d="M320 118 V370" stroke="#2a3354" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="32" y="396" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12">Setiap tamu menyalakan sistem operasinya sendiri.</text>
  <text x="344" y="396" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12">Kontainer hanyalah proses dengan pandangan sendiri.</text>
