<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="judul desk">
  <title id="judul">Mesin virtual dan kontainer</title>
  <desc id="desk">Dua tumpukan berdampingan. Kiri, mesin virtual: perangkat keras, hypervisor, lalu dua mesin tamu yang masing-masing membawa kernel, pustaka, dan aplikasi sendiri. Kanan, kontainer: perangkat keras, satu kernel bersama, Docker Engine, lalu dua kontainer yang hanya membawa pustaka dan aplikasi.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Mesin virtual dan kontainer</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Di mana kernel berada menentukan beratnya.</text>
  <text x="168" y="112" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Mesin virtual</text>
  <text x="472" y="112" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kontainer</text>
