  <text x="102.0" y="164.0" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">katalog</text>
  <rect x="40" y="178" width="124" height="34" rx="8" fill="#3987e5" fill-opacity="0.05" stroke="#3987e5" stroke-width="1.5"/>
