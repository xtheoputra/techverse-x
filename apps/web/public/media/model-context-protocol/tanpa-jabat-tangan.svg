<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" role="img" aria-labelledby="judul desk">
  <title id="judul">Dari jabat tangan ke permintaan yang berdiri sendiri</title>
  <desc id="desk">Atas, revisi sampai 2025-11-25: client mengirim initialize, server menjawab versi dan kapabilitasnya, client mengirim notifications/initialized, lalu tools/call bergantung pada sesi itu. Bawah, revisi 2026-07-28: server/discover opsional, lalu setiap tools/call membawa versi dan kapabilitas di _meta dan dijawab dengan resultType complete.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c3cce6"/>
    </marker>
  </defs>
  <rect width="640" height="740" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Jabat tangan → permintaan mandiri</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Yang berubah di revisi spesifikasi 2026-07-28.</text>

  <!-- ============ Panel lama ============ -->
  <rect x="24" y="100" width="592" height="290" rx="18" fill="#fbbf24" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="44" y="132" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">DULU · SAMPAI 2025-11-25</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="600">
    <rect x="90" y="148" width="120" height="38" rx="10" fill="#0d1226" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="150" y="173" fill="#eef2ff" text-anchor="middle">Client</text>
    <rect x="430" y="148" width="120" height="38" rx="10" fill="#0d1226" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490" y="173" fill="#eef2ff" text-anchor="middle">Server</text>
  </g>
  <g stroke="#2a3150" stroke-width="2" stroke-dasharray="3 5">
    <path d="M150 186 V372"/>
    <path d="M490 186 V372"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <text x="320" y="216" fill="#eef2ff">initialize</text>
    <path d="M152 226 H486" stroke="#c3cce6" stroke-width="2" marker-end="url(#panah)"/>

    <text x="320" y="258" fill="#c3cce6">versi + kapabilitas server</text>
    <path d="M488 268 H154" stroke="#c3cce6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah)"/>

    <text x="320" y="300" fill="#eef2ff">notifications/initialized</text>
    <path d="M152 310 H486" stroke="#c3cce6" stroke-width="2" marker-end="url(#panah)"/>

    <text x="320" y="342" fill="#eef2ff">tools/call</text>
    <path d="M152 352 H486" stroke="#c3cce6" stroke-width="2" marker-end="url(#panah)"/>
  </g>
  <text x="320" y="378" fill="#fbbf24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">konteks disimpan di koneksi/sesi</text>

  <!-- ============ Panel kini ============ -->
  <rect x="24" y="410" width="592" height="306" rx="18" fill="#22d3ee" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="44" y="442" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">KINI · 2026-07-28</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="600">
    <rect x="90" y="458" width="120" height="38" rx="10" fill="#0d1226" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="150" y="483" fill="#eef2ff" text-anchor="middle">Client</text>
    <rect x="430" y="458" width="120" height="38" rx="10" fill="#0d1226" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490" y="483" fill="#eef2ff" text-anchor="middle">Server</text>
  </g>
  <g stroke="#2a3150" stroke-width="2" stroke-dasharray="3 5">
    <path d="M150 496 V692"/>
    <path d="M490 496 V692"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <text x="320" y="526" fill="#98a3c4">server/discover (opsional)</text>
    <path d="M152 536 H486" stroke="#98a3c4" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#panah)"/>

    <text x="320" y="568" fill="#98a3c4">versi, kapabilitas, ttlMs</text>
    <path d="M488 578 H154" stroke="#98a3c4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah)"/>

    <text x="320" y="618" fill="#eef2ff">tools/call + _meta</text>
    <text x="320" y="638" fill="#22d3ee" font-size="14">versi · kapabilitas · clientInfo</text>
    <path d="M152 648 H486" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#panah)"/>

    <text x="320" y="672" fill="#c3cce6">resultType: complete</text>
    <path d="M488 682 H154" stroke="#c3cce6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah)"/>
  </g>
  <text x="320" y="706" fill="#22d3ee" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">setiap permintaan membawa konteksnya sendiri</text>
</svg>
