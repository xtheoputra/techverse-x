<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="judul desk">
  <title id="judul">Arsitektur MCP: host, client, dan server</title>
  <desc id="desk">Satu host berisi tiga client. Client 1 tersambung ke server A (berkas, stdio) dan client 2 ke server B (basis data, stdio), keduanya di mesin yang sama. Client 3 tersambung ke server C (layanan web, Streamable HTTP) di internet.</desc>
  <defs>
    <linearGradient id="garis" gradientUnits="userSpaceOnUse" x1="264" y1="0" x2="360" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="580" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Host → client → server</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Satu client untuk setiap server; pesannya JSON-RPC 2.0.</text>

  <!-- Host -->
  <rect x="24" y="104" width="262" height="420" rx="18" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="2"/>
  <text x="44" y="138" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">HOST</text>
  <text x="44" y="162" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">aplikasi AI, mis. VS Code</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <rect x="46" y="194" width="218" height="68" rx="12" fill="#0d1226" stroke="#22d3ee" stroke-width="2"/>
    <text x="64" y="224" fill="#eef2ff" font-size="19" font-weight="600">Client 1</text>
    <text x="64" y="248" fill="#98a3c4" font-size="15">satu koneksi</text>

    <rect x="46" y="298" width="218" height="68" rx="12" fill="#0d1226" stroke="#22d3ee" stroke-width="2"/>
    <text x="64" y="328" fill="#eef2ff" font-size="19" font-weight="600">Client 2</text>
    <text x="64" y="352" fill="#98a3c4" font-size="15">satu koneksi</text>

    <rect x="46" y="416" width="218" height="68" rx="12" fill="#0d1226" stroke="#22d3ee" stroke-width="2"/>
    <text x="64" y="446" fill="#eef2ff" font-size="19" font-weight="600">Client 3</text>
    <text x="64" y="470" fill="#98a3c4" font-size="15">satu koneksi</text>
  </g>

  <!-- Wilayah: mesin yang sama -->
  <rect x="338" y="152" width="280" height="236" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="356" y="178" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">MESIN YANG SAMA</text>

  <!-- Wilayah: internet -->
  <rect x="338" y="400" width="280" height="124" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="356" y="426" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">INTERNET</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <rect x="360" y="194" width="236" height="68" rx="12" fill="#0d1226" stroke="#8b5cf6" stroke-width="2"/>
    <text x="378" y="224" fill="#eef2ff" font-size="19" font-weight="600">Server A</text>
    <text x="378" y="248" fill="#98a3c4" font-size="15">berkas · stdio</text>

    <rect x="360" y="298" width="236" height="68" rx="12" fill="#0d1226" stroke="#8b5cf6" stroke-width="2"/>
    <text x="378" y="328" fill="#eef2ff" font-size="19" font-weight="600">Server B</text>
    <text x="378" y="352" fill="#98a3c4" font-size="15">basis data · stdio</text>

    <rect x="360" y="438" width="236" height="68" rx="12" fill="#0d1226" stroke="#8b5cf6" stroke-width="2"/>
    <text x="378" y="468" fill="#eef2ff" font-size="19" font-weight="600">Server C</text>
    <text x="378" y="492" fill="#98a3c4" font-size="15">web · Streamable HTTP</text>
  </g>

  <!-- Koneksi -->
  <g stroke="url(#garis)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M264 228 H360"/>
    <path d="M264 332 H360"/>
    <path d="M264 450 C312 450 312 472 360 472"/>
  </g>

  <text x="32" y="556" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Server lokal biasanya melayani satu client; server jarak jauh, banyak.</text>
</svg>
