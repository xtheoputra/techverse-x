<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="judul desk">
  <title id="judul">Multi Round-Trip Requests: server meminta masukan tanpa menyimpan keadaan</title>
  <desc id="desk">Client mengirim tools/call dengan id 1. Server menjawab InputRequiredResult berisi inputRequests dan requestState. Client bertanya kepada pengguna, pengguna menjawab accept. Client mengulang tools/call dengan id 2 yang membawa inputResponses dan requestState yang sama. Server menjawab hasil akhir dengan resultType complete.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c3cce6"/>
    </marker>
    <marker id="panah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="panah-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="640" height="640" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">MRTR: minta masukan, lalu ulang</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Berlaku untuk tools/call, resources/read, dan prompts/get.</text>

  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <rect x="40" y="100" width="120" height="38" rx="10" fill="#0d1226" stroke="#34d399" stroke-width="1.5"/>
    <text x="100" y="125" fill="#eef2ff">Pengguna</text>
    <rect x="260" y="100" width="120" height="38" rx="10" fill="#0d1226" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="320" y="125" fill="#eef2ff">Client</text>
    <rect x="480" y="100" width="120" height="38" rx="10" fill="#0d1226" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="540" y="125" fill="#eef2ff">Server</text>
  </g>
  <g stroke="#2a3150" stroke-width="2" stroke-dasharray="3 5">
    <path d="M100 138 V530"/>
    <path d="M320 138 V530"/>
    <path d="M540 138 V530"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <!-- 1 -->
    <text x="430" y="176" fill="#eef2ff" font-size="15">tools/call · id 1</text>
    <path d="M322 186 H536" stroke="#c3cce6" stroke-width="2" marker-end="url(#panah)"/>

    <!-- 2 -->
    <text x="430" y="226" fill="#22d3ee" font-size="15">InputRequiredResult</text>
    <text x="430" y="246" fill="#98a3c4" font-size="13">inputRequests · requestState</text>
    <path d="M538 256 H324" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah-cyan)"/>

    <!-- 3 -->
    <text x="210" y="300" fill="#eef2ff" font-size="15">tanya (formulir)</text>
    <path d="M318 310 H104" stroke="#34d399" stroke-width="2" marker-end="url(#panah-mint)"/>

    <!-- 4 -->
    <text x="210" y="350" fill="#eef2ff" font-size="15">jawab: accept</text>
    <path d="M102 360 H316" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah-mint)"/>

    <!-- 5 -->
    <text x="430" y="414" fill="#eef2ff" font-size="15">tools/call · id 2</text>
    <text x="430" y="434" fill="#98a3c4" font-size="13">inputResponses · requestState</text>
    <path d="M322 444 H536" stroke="#c3cce6" stroke-width="2" marker-end="url(#panah)"/>

    <!-- 6 -->
    <text x="430" y="494" fill="#c3cce6" font-size="15">resultType: complete</text>
    <path d="M538 504 H324" stroke="#c3cce6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#panah)"/>
  </g>

  <!-- Catatan di sisi server -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#c4b5fd">
    <text x="548" y="282">butuh</text>
    <text x="548" y="298">jawaban</text>
    <text x="548" y="314">pengguna</text>
  </g>

  <rect x="24" y="548" width="592" height="68" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="44" y="577" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Server tak perlu menyimpan apa pun di antara dua permintaan;</text>
  <text x="44" y="599" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">requestState dikembalikan client apa adanya, dengan id baru.</text>
</svg>
