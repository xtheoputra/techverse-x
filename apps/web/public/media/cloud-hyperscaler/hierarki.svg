<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="judul desk">
  <title id="judul">Di mana tagihan dan izin menempel</title>
  <desc id="desk">Tiga kolom pohon. AWS: organisasi, organizational unit, akun, sumber daya. Azure: management group, subscription, resource group, sumber daya. Google Cloud: organisasi, folder, proyek, sumber daya. Tingkat ketiga, yaitu akun AWS, resource group, dan proyek, adalah wadah tempat sumber daya dibuat dan izin diberikan.</desc>
