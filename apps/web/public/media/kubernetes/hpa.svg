  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Garis hijau: jumlah Pod. Garis kuning: rata-rata pemakaian CPU terhadap request (target 50%).</text>
