  <title id="judul">HPA menambah dan mengurangi salinan katalog</title>
  <desc id="desk">Grafik garis. Beban 8 pengunjung serentak berjalan dari detik 0 sampai sekitar detik 246. Jumlah Pod naik dari 3 hingga 10 pada detik 51 dan seterusnya, lalu kembali ke 3 pada detik 593, sekitar lima menit setelah beban berhenti.</desc>
