<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="judul desk">
  <title id="judul">Saat satu worker node mati</title>
  <desc id="desk">Garis waktu. Detik 0: kontainer node perpus-worker2 dihentikan. Detik 52: node tercatat tidak siap. Detik 355: Pod pengganti siap di node lain, sehingga kembali ada 3 Pod siap. Sebelum node ditandai tidak siap, 6 permintaan lewat Gateway gagal, pada detik 4, 11, 24, 31, 39, 46; sejak node ditandai tidak siap, semua permintaan menjawab 200.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Saat satu worker node mati</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Tamu masih dikirim ke Pod yang mati sampai node ditandai NotReady.</text>
  <line x1="60" y1="190" x2="700" y2="190" stroke="#2a3354" stroke-width="2"/>
  <line x1="60.0" y1="185" x2="60.0" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="60.0" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">0 s</text>
  <line x1="140.2" y1="185" x2="140.2" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="140.1670146137787" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">60 s</text>
  <line x1="220.3" y1="185" x2="220.3" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="220.3340292275574" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">120 s</text>
  <line x1="300.5" y1="185" x2="300.5" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="300.5010438413361" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">180 s</text>
  <line x1="380.7" y1="185" x2="380.7" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="380.6680584551148" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">240 s</text>
  <line x1="460.8" y1="185" x2="460.8" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="460.8350730688935" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">300 s</text>
  <line x1="541.0" y1="185" x2="541.0" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="541.0020876826723" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">360 s</text>
  <line x1="621.2" y1="185" x2="621.2" y2="195" stroke="#98a3c4" stroke-width="1"/>
  <text x="621.1691022964509" y="212" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">420 s</text>
  <rect x="60.0" y="140" width="69.5" height="30" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
  <rect x="129.5" y="140" width="404.8" height="30" rx="6" fill="#f87171" fill-opacity="0.18" stroke="#f87171"/>
  <rect x="534.3" y="140" width="165.7" height="30" rx="6" fill="#34d399" fill-opacity="0.18" stroke="#34d399"/>
  <text x="139.47807933194156" y="160" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="start">node NotReady: Pod masih 'menunggu' 300 s</text>
  <text x="617.160751565762" y="160" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">pengganti siap</text>
  <text x="60.0" y="126" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="start">docker stop perpus-worker2</text>
  <text x="129.47807933194156" y="260" fill="#f59e0b" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="start">detik 52: NotReady</text>
  <text x="534.321503131524" y="280" fill="#34d399" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="end">detik 355: 3 Pod siap lagi</text>
  <line x1="65.3" y1="136" x2="65.3" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <line x1="74.7" y1="136" x2="74.7" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <line x1="92.1" y1="136" x2="92.1" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <line x1="101.4" y1="136" x2="101.4" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <line x1="112.1" y1="136" x2="112.1" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <line x1="121.5" y1="136" x2="121.5" y2="174" stroke="#f87171" stroke-width="2.5"/>
  <text x="60.0" y="240" fill="#f87171" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="start">garis merah: 6 dari 7 permintaan gagal sebelum NotReady</text>
  <text x="380.0" y="300" fill="#c3cce6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">permintaan lewat Gateway selama percobaan: 82 dari 88 menjawab 200</text>
</svg>
