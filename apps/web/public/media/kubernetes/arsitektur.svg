  <line x1="660" y1="300" x2="660" y2="266" stroke="#98a3c4" stroke-width="1.6" marker-end="url(#panah)"/>
  <text x="490" y="288" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">kubelet melapor dan menerima tugas lewat kube-apiserver</text>
