  <text x="464.0" y="448.2" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pod</text>
  <rect x="510" y="428" width="76" height="32" rx="8" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
