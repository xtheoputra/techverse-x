  <rect x="86" y="334" width="120" height="44" rx="8" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
  <text x="146.0" y="354.0" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">kubelet</text>
  <text x="146.0" y="370.0" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">menjaga Pod</text>
  <rect x="214" y="334" width="120" height="44" rx="8" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
  <text x="274.0" y="354.0" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">kube-proxy</text>
  <text x="274.0" y="370.0" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">aturan Service</text>
  <rect x="86" y="388" width="248" height="30" rx="8" fill="#98a3c4" fill-opacity="0.06" stroke="#98a3c4" stroke-width="1.5"/>
  <text x="210.0" y="407.2" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">runtime kontainer (containerd)</text>
