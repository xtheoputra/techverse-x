<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="judul desk">
  <title id="judul">Matriks kebingungan maksud pesan</title>
  <desc id="desk">Matriks kebingungan model tanpa kata dasar pada 40 pesan uji. Baris adalah maksud sebenarnya, kolom adalah tebakan. Baris pinjam: 9 ditebak pinjam, 1 ditebak denda. Baris perpanjang: 3 ditebak pinjam, 7 ditebak perpanjang. Baris denda: 10 ditebak denda. Baris jam buka: 10 ditebak jam buka. Presisi dan recall per maksud: pinjam 0,75 dan 0,90; perpanjang 1,00 dan 0,70; denda 0,91 dan 1,00; jam buka 1,00 dan 1,00.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="560" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Siapa tertukar dengan siapa</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Model tanpa kata dasar, 40 pesan uji tulisan tangan.</text>
