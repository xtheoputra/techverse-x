    <text x="498" y="193" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,75 · 0,90</text>
    <text x="498" y="271" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1,00 · 0,70</text>
    <text x="498" y="349" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,91 · 1,00</text>
    <text x="498" y="427" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1,00 · 1,00</text>
    <text x="32" y="498" fill="#c3cce6" font-size="13">Tiga pesan perpanjang ditebak pinjam: recall perpanjang 0,70, presisi pinjam 0,75.</text>
    <text x="32" y="520" fill="#98a3c4" font-size="12">Biru: tebakan benar (diagonal). Jingga: tertukar. Angka dari uji langkah 5 dan 6.</text>
