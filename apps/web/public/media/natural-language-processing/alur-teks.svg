<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="judul desk">
  <title id="judul">Dari pesan ke maksud</title>
  <desc id="desk">Pesan "Kak, saya mau memperpanjang pinjaman ya?" melewati empat tahap. Token: kak, saya, mau, memperpanjang, pinjaman, ya. Kata dasar: kak, saya, mau, panjang, pinjam, ya; memperpanjang menjadi panjang dan pinjaman menjadi pinjam. TF-IDF mengubahnya menjadi deretan angka, lalu regresi logistik memberi peluang: perpanjang 0,66; denda 0,13; pinjam 0,13; jam_buka 0,08. Maksud yang dipilih: perpanjang.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="580" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Dari pesan ke maksud</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Satu pesan pengunjung melewati empat tahap.</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <text x="32" y="112" fill="#eef2ff" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"Kak, saya mau memperpanjang pinjaman ya?"</text>
    <path d="M320 122 V138" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <rect x="32" y="142" width="576" height="70" rx="12" fill="#3987e5" fill-opacity="0.08" stroke="#3987e5" stroke-width="1.5"/>
    <text x="48" y="166" fill="#98a3c4" font-size="12">1 · token: huruf kecil, tanda baca dibuang</text>
    <rect x="48" y="176" width="41" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="68" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">kak</text>
    <rect x="97" y="176" width="49" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="121" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">saya</text>
    <rect x="153" y="176" width="41" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="174" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">mau</text>
    <rect x="202" y="176" width="123" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="263" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">memperpanjang</text>
    <rect x="333" y="176" width="82" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="373" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pinjaman</text>
    <rect x="422" y="176" width="32" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="438" y="194" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ya</text>
    <path d="M320 214 V230" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <rect x="32" y="234" width="576" height="70" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="48" y="258" fill="#98a3c4" font-size="12">2 · kata dasar (Sastrawi)</text>
    <rect x="48" y="268" width="41" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="68" y="286" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">kak</text>
    <rect x="97" y="268" width="49" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="121" y="286" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">saya</text>
    <rect x="153" y="268" width="41" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="174" y="286" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">mau</text>
    <rect x="202" y="268" width="73" height="26" rx="6" fill="#0b1022" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="239" y="286" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">panjang</text>
    <rect x="283" y="268" width="65" height="26" rx="6" fill="#0b1022" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="316" y="286" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">pinjam</text>
    <rect x="357" y="268" width="32" height="26" rx="6" fill="#0b1022" stroke="#2a3354" stroke-width="1.2"/>
    <text x="373" y="286" fill="#eef2ff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ya</text>
    <path d="M320 306 V322" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <rect x="32" y="326" width="576" height="52" rx="12" fill="#199e70" fill-opacity="0.08" stroke="#199e70" stroke-width="1.5"/>
    <text x="48" y="350" fill="#98a3c4" font-size="12">3 · TF-IDF: setiap kata dan pasangan kata menjadi satu angka</text>
    <text x="48" y="368" fill="#c3cce6" font-size="13">kata yang jarang dan khas berbobot besar; kata umum seperti "saya" berbobot kecil</text>
    <path d="M320 380 V396" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="48" y="420" fill="#98a3c4" font-size="12">4 · regresi logistik: peluang setiap maksud</text>
    <text x="48" y="447" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">perpanjang</text>
    <rect x="160" y="435" width="236.7" height="16" rx="4" fill="#3987e5"/>
    <text x="404.7" y="447" fill="#eef2ff" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,66</text>
    <text x="48" y="473" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">denda</text>
    <rect x="160" y="461" width="47.3" height="16" rx="4" fill="#2a3354"/>
    <text x="215.3" y="473" fill="#eef2ff" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,13</text>
    <text x="48" y="499" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pinjam</text>
    <rect x="160" y="487" width="45.8" height="16" rx="4" fill="#2a3354"/>
    <text x="213.8" y="499" fill="#eef2ff" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,13</text>
    <text x="48" y="525" fill="#c3cce6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">jam_buka</text>
    <rect x="160" y="513" width="30.2" height="16" rx="4" fill="#2a3354"/>
    <text x="198.2" y="525" fill="#eef2ff" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0,08</text>
    <text x="32" y="560" fill="#98a3c4" font-size="12">Kotak kuning: kata yang berubah. Angka dari model langkah 5 dengan kata dasar.</text>
  </g>
</svg>
