<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="judul desk">
  <title id="judul">Kurva latih dan validasi</title>
  <desc id="desk">Grafik garis loss terhadap langkah latihan, 0 sampai 1.500, pada 60 contoh latih dan 900 contoh validasi. Loss latih turun terus sampai 0,001. Loss validasi tanpa regularisasi turun ke titik terendah 0,481 di langkah 104, lalu naik sampai 1,702: model mulai menghafal. Dengan weight decay, loss validasi di akhir hanya 0,919. Garis putus-putus menandai titik berhenti dini di langkah 104.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="470" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Ketika model mulai menghafal</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Loss pada 60 contoh latih dan 900 contoh validasi, langkah 0 sampai 1.500.</text>
