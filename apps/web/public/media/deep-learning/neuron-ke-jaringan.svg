<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="judul desk">
  <title id="judul">Dari satu neuron ke jaringan</title>
  <desc id="desk">Atas: satu neuron menerima tiga masukan, 2, 1, dan 0, dengan bobot 0,5, minus 1, dan 2. Jumlah berbobotnya ditambah bias 0,3 menjadi z = 0,3, lalu aktivasi ReLU mengeluarkan 0,3. Bawah: neuron-neuron disusun berlapis: 2 masukan, dua lapisan tersembunyi berisi 4 neuron, dan 3 keluaran. Setiap garis adalah satu bobot yang dipelajari. Disebut deep karena lapisan tersembunyinya banyak.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="610" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Dari satu neuron ke jaringan</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Kalikan, jumlahkan, tambah bias, lalu aktivasi.</text>
