    <rect x="422" y="164" width="100" height="52" rx="12" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="2"/>
    <text x="472" y="187" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">ReLU</text>
    <text x="472" y="206" fill="#98a3c4" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">max(0, z)</text>
    <path d="M522 190 H572" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
