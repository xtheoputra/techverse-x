    <text x="36" y="255" fill="#98a3c4" font-size="14" text-anchor="end">x₃</text>
    <path d="M94 250 L296 190" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="106" y="270" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">× 2</text>
    <circle cx="330" cy="190" r="32" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="2"/>
    <text x="330" y="196" fill="#eef2ff" font-size="18" text-anchor="middle">Σ</text>
    <text x="330" y="244" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">+ b (0,3)</text>
