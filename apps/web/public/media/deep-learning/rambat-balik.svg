    <text x="75" y="279" fill="#98a3c4" font-size="12" text-anchor="middle">x₂</text>
    <text x="75" y="297" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">−2,00</text>
    <text x="75" y="314" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,275</text>
    <rect x="32" y="328" width="86" height="60" rx="10" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
    <text x="75" y="345" fill="#98a3c4" font-size="12" text-anchor="middle">w₂</text>
