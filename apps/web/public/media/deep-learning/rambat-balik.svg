    <text x="211" y="178" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,80</text>
    <text x="211" y="195" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,915</text>
    <rect x="168" y="295" width="86" height="60" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="211" y="312" fill="#98a3c4" font-size="12" text-anchor="middle">×</text>
    <text x="211" y="330" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">−0,60</text>
    <text x="211" y="347" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,915</text>
    <rect x="300" y="219" width="86" height="60" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="343" y="236" fill="#98a3c4" font-size="12" text-anchor="middle">+</text>
    <text x="343" y="254" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,20</text>
    <text x="343" y="271" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,915</text>
    <rect x="420" y="300" width="86" height="60" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="463" y="317" fill="#98a3c4" font-size="12" text-anchor="middle">+ b → n</text>
    <text x="463" y="335" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,30</text>
    <text x="463" y="352" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,915</text>
    <rect x="536" y="300" width="86" height="60" rx="10" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="579" y="317" fill="#98a3c4" font-size="12" text-anchor="middle">tanh → o</text>
    <text x="579" y="335" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,2913</text>
    <text x="579" y="352" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1,000</text>
    <text x="32" y="444" fill="#c3cce6" font-size="13">1 − o² = 0,915: gradien tanh, diteruskan ke n.</text>
    <text x="32" y="468" fill="#c3cce6" font-size="13">Penjumlahan meneruskan 0,915 apa adanya ke setiap cabangnya.</text>
    <text x="32" y="492" fill="#c3cce6" font-size="13">Perkalian mengalikan dengan pasangannya: w₂ mendapat x₂ · 0,915 = −1,830.</text>
    <text x="32" y="516" fill="#98a3c4" font-size="13">Gradien negatif: menaikkan w₂ sedikit justru menurunkan o.</text>
    <text x="32" y="552" fill="#98a3c4" font-size="12">Angka sama persis dengan kelas Nilai di langkah 5, turunan numerik, dan autograd PyTorch.</text>
  </g>
</svg>
