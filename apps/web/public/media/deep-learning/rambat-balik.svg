<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="judul desk">
  <title id="judul">Rambat balik pada satu neuron</title>
  <desc id="desk">Graf komputasi untuk o = tanh(x1·w1 + x2·w2 + b) dengan x1 = 1, w1 = 0,8, x2 = minus 2, w2 = 0,3, b = 0,1. Nilai maju: x1·w1 = 0,80, x2·w2 = −0,60, jumlahnya 0,20, n = 0,30, o = 0,2913. Gradien mundur: o 1; n 0,915; kedua hasil kali 0,915; w1 0,915; x1 0,732; w2 −1,830; x2 0,275; b 0,915. Penjumlahan meneruskan gradien apa adanya; perkalian mengalikannya dengan angka pasangannya.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="580" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Rambat balik pada satu neuron</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Maju menghitung nilai (putih). Mundur menghitung gradien (jingga).</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
