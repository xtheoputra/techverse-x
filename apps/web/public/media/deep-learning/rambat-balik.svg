    <path d="M254 173 L297 249" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <path d="M254 325 L297 249" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <path d="M386 249 L417 330" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <path d="M386 360 L417 330" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <path d="M506 330 L533 330" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <rect x="32" y="110" width="86" height="60" rx="10" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
    <text x="75" y="127" fill="#98a3c4" font-size="12" text-anchor="middle">x₁</text>
    <text x="75" y="145" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1,00</text>
    <text x="75" y="162" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,732</text>
    <rect x="32" y="176" width="86" height="60" rx="10" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
    <text x="75" y="193" fill="#98a3c4" font-size="12" text-anchor="middle">w₁</text>
