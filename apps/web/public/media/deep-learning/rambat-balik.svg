    <text x="75" y="380" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">−1,830</text>
    <rect x="300" y="330" width="86" height="60" rx="10" fill="#3987e5" fill-opacity="0.1" stroke="#3987e5" stroke-width="1.5"/>
    <text x="343" y="347" fill="#98a3c4" font-size="12" text-anchor="middle">b</text>
    <text x="343" y="365" fill="#eef2ff" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,10</text>
    <text x="343" y="382" fill="#fbbf24" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">0,915</text>
