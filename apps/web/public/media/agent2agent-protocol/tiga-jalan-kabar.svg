<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="judul desk">
  <title id="judul">Tiga cara client menerima kabar Task</title>
  <desc id="desk">Tiga lajur antara client di kiri dan agen di kanan. Polling: client memanggil GetTask berulang dan setiap kali menerima Task terbaru. Streaming: client memanggil SendStreamingMessage sekali, lalu agen mengirim aliran Server-Sent Events berisi task, statusUpdate, artifactUpdate, dan statusUpdate COMPLETED, setelah itu aliran ditutup. Push: client mendaftarkan URL webhook, agen mengirim HTTP POST ke webhook itu saat keadaan Task berubah, lalu client memanggil GetTask untuk mengambil Task lengkap.</desc>
  <defs>
    <marker id="panah-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="panah-ungu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="640" height="660" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Tiga cara menerima kabar Task</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Panah cyan: client → agen. Panah ungu: agen → client.</text>

  <!-- Kepala kolom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5">
    <text x="76" y="112" fill="#67e8f9" text-anchor="middle">CLIENT</text>
    <text x="564" y="112" fill="#c4b5fd" text-anchor="middle">AGEN</text>
  </g>
  <g stroke="#2a3150" stroke-width="2">
    <path d="M76 122 V624"/>
    <path d="M564 122 V624"/>
  </g>

  <!-- Lajur 1: polling -->
  <rect x="24" y="130" width="592" height="160" rx="14" fill="#0d1226" fill-opacity="0.6" stroke="#2a3150" stroke-width="1.5"/>
  <text x="320" y="156" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">1 · Polling — paling sederhana</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <path d="M80 182 H556" stroke="#22d3ee" stroke-width="2" marker-end="url(#panah-cyan)"/>
    <text x="320" y="176" fill="#a5f3fc" text-anchor="middle">GetTask</text>
    <path d="M560 212 H84" stroke="#a78bfa" stroke-width="2" marker-end="url(#panah-ungu)"/>
    <text x="320" y="206" fill="#ddd6fe" text-anchor="middle">Task · WORKING</text>
    <path d="M80 244 H556" stroke="#22d3ee" stroke-width="2" marker-end="url(#panah-cyan)"/>
    <text x="320" y="238" fill="#a5f3fc" text-anchor="middle">GetTask (lagi)</text>
    <path d="M560 276 H84" stroke="#a78bfa" stroke-width="2" marker-end="url(#panah-ungu)"/>
    <text x="320" y="270" fill="#ddd6fe" text-anchor="middle">Task · COMPLETED</text>
  </g>

  <!-- Lajur 2: streaming -->
  <rect x="24" y="304" width="592" height="164" rx="14" fill="#0d1226" fill-opacity="0.6" stroke="#2a3150" stroke-width="1.5"/>
  <text x="320" y="330" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">2 · Streaming (SSE) — satu koneksi terbuka</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <path d="M80 354 H556" stroke="#22d3ee" stroke-width="2" marker-end="url(#panah-cyan)"/>
    <text x="320" y="348" fill="#a5f3fc" text-anchor="middle">SendStreamingMessage</text>
    <rect x="120" y="366" width="400" height="88" rx="10" fill="#8b5cf6" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="136" y="388" fill="#ddd6fe">data: {"task": … SUBMITTED}</text>
    <text x="136" y="408" fill="#ddd6fe">data: {"statusUpdate": … WORKING}</text>
    <text x="136" y="428" fill="#ddd6fe">data: {"artifactUpdate": …}</text>
    <text x="136" y="448" fill="#ddd6fe">data: {"statusUpdate": … COMPLETED}</text>
    <path d="M560 410 H524" stroke="#a78bfa" stroke-width="2" marker-end="url(#panah-ungu)"/>
    <path d="M118 410 H84" stroke="#a78bfa" stroke-width="2" marker-end="url(#panah-ungu)"/>
  </g>

  <!-- Lajur 3: push -->
  <rect x="24" y="482" width="592" height="142" rx="14" fill="#0d1226" fill-opacity="0.6" stroke="#2a3150" stroke-width="1.5"/>
  <text x="320" y="508" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">3 · Push — client boleh pergi</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <path d="M80 534 H556" stroke="#22d3ee" stroke-width="2" marker-end="url(#panah-cyan)"/>
    <text x="320" y="528" fill="#a5f3fc" text-anchor="middle">daftarkan webhook (url, token)</text>
    <path d="M560 568 H84" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#panah-ungu)"/>
    <text x="320" y="562" fill="#ddd6fe" text-anchor="middle">jam kemudian: POST ke webhook</text>
    <path d="M80 604 H556" stroke="#22d3ee" stroke-width="2" marker-end="url(#panah-cyan)"/>
    <text x="320" y="598" fill="#a5f3fc" text-anchor="middle">GetTask → Task lengkap</text>
  </g>

  <text x="32" y="648" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14">Streaming dan push hanya bila Agent Card menyatakan kapabilitasnya.</text>
</svg>
