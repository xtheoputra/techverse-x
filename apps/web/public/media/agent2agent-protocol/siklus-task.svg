<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="judul desk">
  <title id="judul">Siklus hidup Task di A2A 1.0</title>
  <desc id="desk">Task dibuat dalam keadaan TASK_STATE_SUBMITTED, lalu umumnya berpindah ke TASK_STATE_WORKING. Dari WORKING, Task bisa berhenti sementara di salah satu keadaan terputus, TASK_STATE_INPUT_REQUIRED atau TASK_STATE_AUTH_REQUIRED, dan kembali bekerja setelah client mengirim pesan dengan taskId yang sama atau kredensial diterima. Task berakhir di salah satu keadaan terminal: COMPLETED, FAILED, CANCELED, atau REJECTED. REJECTED boleh terjadi sejak awal. Task terminal tidak bisa menerima pesan lagi.</desc>
  <defs>
    <marker id="panah-abu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c3cce6"/>
    </marker>
    <marker id="panah-kuning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="panah-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="640" height="620" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Siklus hidup Task</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Semua nilai berawalan TASK_STATE_ di versi 1.0.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
    <!-- SUBMITTED -->
    <rect x="210" y="104" width="220" height="52" rx="12" fill="#0d1226" stroke="#c3cce6" stroke-width="2"/>
    <text x="320" y="136" fill="#eef2ff" font-size="17" text-anchor="middle">SUBMITTED</text>

    <!-- WORKING -->
    <rect x="210" y="210" width="220" height="56" rx="12" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="320" y="244" fill="#a5f3fc" font-size="18" text-anchor="middle">WORKING</text>
  </g>
  <path d="M320 156 V204" stroke="#c3cce6" stroke-width="2.5" fill="none" marker-end="url(#panah-abu)"/>

  <!-- Wilayah terputus -->
  <rect x="20" y="318" width="250" height="196" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="36" y="344" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">TERPUTUS · MENUNGGU CLIENT</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
    <rect x="36" y="362" width="218" height="50" rx="12" fill="#0d1226" stroke="#fbbf24" stroke-width="2"/>
    <text x="145" y="393" fill="#fde68a" font-size="16" text-anchor="middle">INPUT_REQUIRED</text>
    <rect x="36" y="436" width="218" height="50" rx="12" fill="#0d1226" stroke="#fbbf24" stroke-width="2"/>
    <text x="145" y="467" fill="#fde68a" font-size="16" text-anchor="middle">AUTH_REQUIRED</text>
  </g>

  <!-- Wilayah terminal -->
  <rect x="370" y="318" width="250" height="250" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="386" y="344" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">TERMINAL · SELESAI</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="16" text-anchor="middle">
    <rect x="386" y="362" width="218" height="42" rx="12" fill="#0d1226" stroke="#34d399" stroke-width="2"/>
    <text x="495" y="389" fill="#a7f3d0">COMPLETED</text>
    <rect x="386" y="414" width="218" height="42" rx="12" fill="#0d1226" stroke="#fb7185" stroke-width="2"/>
    <text x="495" y="441" fill="#fecdd3">FAILED</text>
    <rect x="386" y="466" width="218" height="42" rx="12" fill="#0d1226" stroke="#98a3c4" stroke-width="2"/>
    <text x="495" y="493" fill="#c3cce6">CANCELED</text>
    <rect x="386" y="518" width="218" height="42" rx="12" fill="#0d1226" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="495" y="545" fill="#fecdd3">REJECTED</text>
  </g>

  <!-- WORKING ke terminal -->
  <path d="M400 266 C430 290 470 296 488 312" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#panah-mint)"/>
  <!-- SUBMITTED boleh langsung ditolak -->
  <path d="M430 130 C560 130 600 210 600 312" stroke="#fb7185" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#panah-abu)"/>
  <text x="470" y="118" fill="#fda4af" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13">boleh ditolak sejak awal</text>

  <!-- WORKING ke/dari terputus -->
  <path d="M232 266 C214 290 190 300 176 312" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#panah-kuning)"/>
  <path d="M120 312 C120 250 160 238 204 238" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#panah-kuning)"/>
  <g fill="#fde68a" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13">
    <text x="28" y="200">pesan dengan taskId</text>
    <text x="28" y="218">yang sama, atau</text>
    <text x="28" y="236">kredensial diterima</text>
  </g>

  <text x="32" y="596" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14">Alur umum, bukan urutan wajib. Pesan ke Task terminal ditolak (-32004).</text>
</svg>
