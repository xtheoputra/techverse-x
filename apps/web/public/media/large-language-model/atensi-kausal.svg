<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="judul desk">
  <title id="judul">Bobot atensi kausal untuk lima token</title>
  <desc id="desk">Matriks 5 kali 5. Baris adalah token yang sedang diproses, kolom adalah token yang dilihatnya. Segitiga kanan atas kosong karena masker kausal: token tak boleh melihat token sesudahnya. Setiap baris berjumlah 1. Baris t1: 1,00. Baris t2: 0,22, 0,78. Baris t3: 0,57, 0,34, 0,09. Baris t4: 0,03, 0,72, 0,19, 0,06. Baris t5: 0,52, 0,06, 0,10, 0,13, 0,19. Angka berasal dari vektor acak dengan benih tetap, hanya untuk memperlihatkan bentuknya.</desc>
