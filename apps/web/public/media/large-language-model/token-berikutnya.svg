<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="judul desk">
  <title id="judul">Peluang kata berikutnya pada tiga suhu</title>
  <desc id="desk">Sesudah "Saya ingin meminjam", model memberi skor untuk lima kata. Peluangnya: suhu 0,5: buku 0,79, novel 0,16, komik 0,04, majalah 0,01, sepeda 0,00; suhu 1,0: buku 0,56, novel 0,25, komik 0,12, majalah 0,06, sepeda 0,01; suhu 1,5: buku 0,44, novel 0,26, komik 0,16, majalah 0,10, sepeda 0,03. Suhu rendah menajamkan pilihan ke "buku"; suhu tinggi meratakannya. Nucleus sampling dengan top-p 0,9 pada suhu 1,0 hanya menyisakan buku, novel, dan komik.</desc>
