<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="judul desk">
  <title id="judul">Eksplorasi pada sepuluh mesin slot</title>
  <desc id="desk">Grafik persentase memilih mesin terbaik selama 1000 tarikan, rata-rata 2000 soal. Garis epsilon 0,1 naik paling cepat ke sekitar 80 persen. Garis epsilon 0,01 naik pelan ke sekitar 61 persen. Garis serakah mendatar di sekitar 36 persen.</desc>
