<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="judul desk">
  <title id="judul">Jalur Q-learning dan SARSA</title>
  <desc id="desk">Peta lorong 4 kali 12 sel. Meja di pojok kiri bawah, rak di pojok kanan bawah, dan sepuluh sel tangga di antaranya. Jalur Q-learning naik satu sel lalu menyusuri baris tepat di atas tangga (13 langkah). Jalur SARSA naik sampai baris paling atas, menyeberang, lalu turun ke rak (17 langkah).</desc>
