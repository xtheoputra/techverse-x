  <title id="judul">Putaran agen dan lingkungan</title>
  <desc id="desk">Robot pengantar buku (agen) mengirim aksi, misalnya kanan, ke lorong perpustakaan (lingkungan). Lorong membalas dengan keadaan baru, misalnya sel 25, dan hadiah, misalnya minus 1. Putaran berulang sampai buku sampai di rak.</desc>
