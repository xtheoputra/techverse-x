<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="judul desk">
  <title id="judul">Membalas tool paralel: semua hasil dalam satu pesan</title>
  <desc id="desk">Giliran asisten berisi dua blok tool_use, A dan B. Cara benar: satu pesan user berisi tool_result A lalu tool_result B, dan teks apa pun sesudah semua hasil. Cara salah pertama: dua pesan user terpisah, satu hasil per pesan; ini mengajari model berhenti memanggil tool secara paralel. Cara salah kedua: teks sebelum tool_result; API menolaknya dengan galat 400.</desc>
  <rect width="640" height="620" rx="24" fill="#070a16"/>

  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Dua tool_use, satu balasan</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Urutan menjalankannya bebas; bentuk balasannya tidak.</text>

  <!-- Giliran asisten -->
  <rect x="24" y="100" width="592" height="70" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="2"/>
  <text x="40" y="126" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">ASSISTANT</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="160" y="112" width="200" height="44" rx="10" fill="#0d1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="176" y="139" fill="#ddd6fe">tool_use · id A</text>
    <rect x="380" y="112" width="200" height="44" rx="10" fill="#0d1226" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="396" y="139" fill="#ddd6fe">tool_use · id B</text>
  </g>

  <!-- Benar -->
  <rect x="24" y="196" width="592" height="116" rx="14" fill="#34d399" fill-opacity="0.06" stroke="#34d399" stroke-width="2"/>
  <text x="40" y="224" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">✓ BENAR · SATU PESAN USER</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="40" y="240" width="176" height="44" rx="10" fill="#0d1226" stroke="#34d399" stroke-width="1.5"/>
    <text x="54" y="267" fill="#a7f3d0">tool_result A</text>
    <rect x="228" y="240" width="176" height="44" rx="10" fill="#0d1226" stroke="#34d399" stroke-width="1.5"/>
    <text x="242" y="267" fill="#a7f3d0">tool_result B</text>
    <rect x="416" y="240" width="184" height="44" rx="10" fill="#0d1226" stroke="#5b6585" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="430" y="267" fill="#98a3c4">teks (boleh, sesudah)</text>
  </g>

  <!-- Salah 1 -->
  <rect x="24" y="336" width="592" height="116" rx="14" fill="#fb7185" fill-opacity="0.05" stroke="#fb7185" stroke-width="2"/>
  <text x="40" y="364" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">✗ DUA PESAN USER</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="40" y="380" width="176" height="44" rx="10" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="54" y="407" fill="#fecdd3">tool_result A</text>
    <text x="228" y="407" fill="#fda4af">│</text>
    <rect x="248" y="380" width="176" height="44" rx="10" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="262" y="407" fill="#fecdd3">tool_result B</text>
  </g>
  <text x="40" y="442" fill="#fda4af" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13">mengajari model berhenti memanggil tool secara paralel</text>

  <!-- Salah 2 -->
  <rect x="24" y="476" width="592" height="100" rx="14" fill="#fb7185" fill-opacity="0.05" stroke="#fb7185" stroke-width="2"/>
  <text x="40" y="504" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">✗ TEKS SEBELUM HASIL → 400</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="40" y="516" width="150" height="44" rx="10" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="54" y="543" fill="#fecdd3">teks</text>
    <rect x="202" y="516" width="176" height="44" rx="10" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="216" y="543" fill="#fecdd3">tool_result A</text>
    <rect x="390" y="516" width="176" height="44" rx="10" fill="#0d1226" stroke="#fb7185" stroke-width="1.5"/>
    <text x="404" y="543" fill="#fecdd3">tool_result B</text>
  </g>

  <text x="32" y="604" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14">Tool yang tak jadi dijalankan tetap dibalas: is_error: true.</text>
</svg>
