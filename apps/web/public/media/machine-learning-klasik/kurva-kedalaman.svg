<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="judul desk">
  <title id="judul">Pohon yang terlalu dalam menghafal</title>
  <desc id="desk">Akurasi pohon keputusan untuk kedalaman 1 sampai 20. Garis akurasi latih naik terus sampai 100% di kedalaman 19. Garis akurasi uji naik sampai 83,0% di kedalaman 6, lalu turun ke 78,2% di kedalaman 20. Jarak yang makin lebar di kanan adalah overfitting: pohon menghafal data latih.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="450" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Pohon yang terlalu dalam menghafal</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Akurasi latih dan uji untuk kedalaman pohon 1 sampai 20.</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <path d="M80 380.0 H600" stroke="#98a3c4" stroke-opacity="0.15"/>
    <text x="72.0" y="384.0" fill="#98a3c4" font-size="11" text-anchor="end">70%</text>
    <path d="M80 286.7 H600" stroke="#98a3c4" stroke-opacity="0.15"/>
    <text x="72.0" y="290.7" fill="#98a3c4" font-size="11" text-anchor="end">80%</text>
    <path d="M80 193.3 H600" stroke="#98a3c4" stroke-opacity="0.15"/>
    <text x="72.0" y="197.3" fill="#98a3c4" font-size="11" text-anchor="end">90%</text>
    <path d="M80 100.0 H600" stroke="#98a3c4" stroke-opacity="0.15"/>
    <text x="72.0" y="104.0" fill="#98a3c4" font-size="11" text-anchor="end">100%</text>
    <text x="80.0" y="400.0" fill="#98a3c4" font-size="11" text-anchor="middle">1</text>
    <text x="189.5" y="400.0" fill="#98a3c4" font-size="11" text-anchor="middle">5</text>
    <text x="326.3" y="400.0" fill="#98a3c4" font-size="11" text-anchor="middle">10</text>
    <text x="463.2" y="400.0" fill="#98a3c4" font-size="11" text-anchor="middle">15</text>
    <text x="600.0" y="400.0" fill="#98a3c4" font-size="11" text-anchor="middle">20</text>
    <text x="340.0" y="420.0" fill="#98a3c4" font-size="12" text-anchor="middle">kedalaman pohon (max_depth)</text>
    <path d="M80.0 342.4 L107.4 301.3 L134.7 269.6 L162.1 258.7 L189.5 248.4 L216.8 234.7 L244.2 217.3 L271.6 203.0 L298.9 179.0 L326.3 164.1 L353.7 149.5 L381.1 133.9 L408.4 123.3 L435.8 114.0 L463.2 109.0 L490.5 105.0 L517.9 102.8 L545.3 100.6 L572.6 100.3 L600.0 100.0" fill="none" stroke="#3987e5" stroke-width="2.5"/>
    <path d="M80.0 341.7 L107.4 310.9 L134.7 282.9 L162.1 269.9 L189.5 260.5 L216.8 258.7 L244.2 259.6 L271.6 260.5 L298.9 281.1 L326.3 284.8 L353.7 282.0 L381.1 292.3 L408.4 295.1 L435.8 294.1 L463.2 301.6 L490.5 298.8 L517.9 300.7 L545.3 303.5 L572.6 302.5 L600.0 303.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="216.8" cy="258.7" r="5" fill="#f59e0b"/>
    <text x="216.8" y="280.7" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">puncak uji 83,0%</text>
    <text x="596.0" y="90.0" fill="#3987e5" font-size="13" font-weight="700" text-anchor="end">latih</text>
    <text x="596.0" y="293.5" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="end">uji</text>
  </g>
</svg>
