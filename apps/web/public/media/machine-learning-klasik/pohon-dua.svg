<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="judul desk">
  <title id="judul">Pohon yang menemukan batas 10 km</title>
  <desc id="desk">Pohon keputusan kedalaman 2 yang dipelajari dari 3.000 pinjaman. Pertanyaan pertama: apakah jarak rumah paling jauh 10 km. Bila ya (1450 pinjaman, 8,2% telat), pertanyaan berikutnya: apakah dipinjam menjelang libur. Tidak: 1176 pinjaman, 4,5% telat. Ya: 274 pinjaman, 24,1% telat. Bila lebih dari 10 km (1550 pinjaman, 42,6% telat), pertanyaan berikutnya: batas pinjamnya 7 hari atau 14 hari. Tujuh hari: 734 pinjaman, 59,0% telat, satu-satunya daun yang ditebak terlambat. Empat belas hari: 816 pinjaman, 27,8% telat.</desc>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a3c4"/>
    </marker>
  </defs>
  <rect width="640" height="470" rx="24" fill="#070a16"/>
  <text x="32" y="48" fill="#eef2ff" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700">Pohon yang menemukan batas 10 km</text>
  <text x="32" y="76" fill="#98a3c4" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15">Pohon kedalaman 2 dari 3.000 pinjaman latih. Daun jingga ditebak “telat”.</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
    <rect x="200.0" y="100.0" width="240.0" height="62.0" rx="10" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.5"/>
    <text x="320.0" y="126.0" fill="#eef2ff" font-size="14" font-weight="700" text-anchor="middle">jarak_km ≤ 10 ?</text>
    <text x="320.0" y="148.0" fill="#c3cce6" font-size="12" text-anchor="middle">3.000 pinjaman, 26,0% telat</text>
    <path d="M320 162 L164 206" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="224.0" y="190.0" fill="#98a3c4" font-size="12" text-anchor="middle">ya</text>
    <rect x="24.0" y="208.0" width="280.0" height="62.0" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="164.0" y="234.0" fill="#eef2ff" font-size="14" font-weight="700" text-anchor="middle">jelang_libur ?</text>
    <text x="164.0" y="256.0" fill="#c3cce6" font-size="12" text-anchor="middle">1.450 pinjaman, 8,2% telat</text>
    <path d="M164 270 L94 318" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="115.0" y="300.0" fill="#98a3c4" font-size="12" text-anchor="middle">tidak</text>
    <rect x="28.0" y="320.0" width="132.0" height="74.0" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
    <text x="94.0" y="344.0" fill="#eef2ff" font-size="13" font-weight="700" text-anchor="middle">tepat waktu</text>
    <text x="94.0" y="364.0" fill="#c3cce6" font-size="12" text-anchor="middle">1.176 pinjaman</text>
    <text x="94.0" y="382.0" fill="#98a3c4" font-size="12" text-anchor="middle">4,5% telat</text>
    <path d="M164 270 L234 318" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="213.0" y="300.0" fill="#98a3c4" font-size="12" text-anchor="middle">ya</text>
    <rect x="168.0" y="320.0" width="132.0" height="74.0" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
    <text x="234.0" y="344.0" fill="#eef2ff" font-size="13" font-weight="700" text-anchor="middle">tepat waktu</text>
    <text x="234.0" y="364.0" fill="#c3cce6" font-size="12" text-anchor="middle">274 pinjaman</text>
    <text x="234.0" y="382.0" fill="#98a3c4" font-size="12" text-anchor="middle">24,1% telat</text>
    <path d="M320 162 L476 206" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="416.0" y="190.0" fill="#98a3c4" font-size="12" text-anchor="middle">tidak</text>
    <rect x="336.0" y="208.0" width="280.0" height="62.0" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="476.0" y="234.0" fill="#eef2ff" font-size="14" font-weight="700" text-anchor="middle">batas pinjam 7 hari ?</text>
    <text x="476.0" y="256.0" fill="#c3cce6" font-size="12" text-anchor="middle">1.550 pinjaman, 42,6% telat</text>
    <path d="M476 270 L406 318" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="427.0" y="300.0" fill="#98a3c4" font-size="12" text-anchor="middle">ya</text>
    <rect x="340.0" y="320.0" width="132.0" height="74.0" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="406.0" y="344.0" fill="#eef2ff" font-size="13" font-weight="700" text-anchor="middle">telat</text>
    <text x="406.0" y="364.0" fill="#c3cce6" font-size="12" text-anchor="middle">734 pinjaman</text>
    <text x="406.0" y="382.0" fill="#98a3c4" font-size="12" text-anchor="middle">59,0% telat</text>
    <path d="M476 270 L546 318" fill="none" stroke="#98a3c4" stroke-width="1.5" marker-end="url(#panah)"/>
    <text x="525.0" y="300.0" fill="#98a3c4" font-size="12" text-anchor="middle">tidak</text>
    <rect x="480.0" y="320.0" width="132.0" height="74.0" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
    <text x="546.0" y="344.0" fill="#eef2ff" font-size="13" font-weight="700" text-anchor="middle">tepat waktu</text>
    <text x="546.0" y="364.0" fill="#c3cce6" font-size="12" text-anchor="middle">816 pinjaman</text>
    <text x="546.0" y="382.0" fill="#98a3c4" font-size="12" text-anchor="middle">27,8% telat</text>
    <text x="32.0" y="430.0" fill="#98a3c4" font-size="12">Aturan 10 km tak pernah diberitahukan: pohon menemukannya sendiri dari data.</text>
    <text x="32.0" y="450.0" fill="#98a3c4" font-size="12">Akurasi di data uji: 77,4%; akurasi seimbang 70,6%.</text>
  </g>
</svg>
