<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="judul desk">
  <title id="judul">Validasi silang lima lipatan</title>
  <desc id="desk">Validasi silang lima lipatan. Data latih dibagi menjadi lima bagian sama besar. Di putaran pertama, bagian 1 menjadi data validasi dan bagian 2 sampai 5 menjadi data latih; di putaran kedua, bagian 2 yang menjadi validasi; begitu seterusnya sampai lima putaran. Setiap baris data menjadi validasi tepat satu kali. Hasilnya lima angka, lalu dirata-ratakan. Data uji di kanan tetap disimpan di luar semua putaran.</desc>
